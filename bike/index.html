<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <title>自転車ログ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #16a34a;
      --accent-fg: #ffffff;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      background: var(--accent);
      color: var(--accent-fg);
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge { font-size: 11px; opacity: 0.85; }
    main { padding: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .row + .row { margin-top: 8px; }
    label {
      flex: 0 0 90px;
      color: var(--muted);
      font-size: 13px;
    }
    input[type="date"],
    input[type="number"],
    input[type="text"],
    textarea {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #ffffff;
    }
    textarea { min-height: 60px; resize: vertical; }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button.primary {
      background: var(--accent);
      color: var(--accent-fg);
      width: 100%;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
    }
    .gps-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .gps-row > button { flex: 1; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .stat {
      text-align: center;
      padding: 8px 4px;
      background: #f1f5f9;
      border-radius: 6px;
    }
    .stat .v { font-size: 16px; font-weight: 700; color: var(--fg); }
    .stat .u { font-size: 10px; color: var(--muted); }
    #map {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      background: #e2e8f0;
      margin-top: 8px;
    }
    .log-item {
      border-top: 1px solid var(--border);
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .log-item:first-of-type { border-top: none; }
    .log-item .info { flex: 1; min-width: 0; }
    .log-item .info .d { font-weight: 600; font-size: 13px; }
    .log-item .info .m { font-size: 12px; color: var(--muted); }
    .log-item .info .n {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty { color: var(--muted); text-align: center; padding: 14px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 9999;
      max-width: 90%;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #b91c1c; }
    /* Mode tabs at the top of the page: switch between the new-record
       form and the read-only route-detail map. */
    .mode-tabs {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .mode-tab {
      flex: 1;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .mode-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    /* Route-detail view: stats row + map + list. */
    .route-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .route-stats .stat {
      text-align: center;
      padding: 8px 4px;
      background: #f1f5f9;
      border-radius: 6px;
    }
    .route-stats .stat .v { font-size: 16px; font-weight: 700; color: var(--fg); }
    .route-stats .stat .u { font-size: 10px; color: var(--muted); }
    .route-stats .stat.empty .v { color: var(--muted); font-weight: 400; font-size: 13px; }
    .route-map {
      width: 100%;
      height: 480px;
      background: #e2e8f0;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .list-wrap {
      max-height: 360px;
      overflow-y: auto;
    }
    .month-label {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 4px 4px;
      font-weight: 600;
    }
    .route-item {
      border-top: 1px solid var(--border);
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .route-item:first-of-type { border-top: none; }
    .route-item:hover { background: #f1f5f9; }
    .route-item.selected { background: var(--accent-soft); }
    .route-item .info { flex: 1; min-width: 0; }
    .route-item .date { font-weight: 600; font-size: 13px; }
    .route-item .km { color: var(--accent); font-weight: 700; font-size: 13px; }
    .route-item .meta { font-size: 12px; color: var(--muted); }
    .route-item .title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .route-item .no-gps { font-size: 11px; color: var(--danger); }
    .summary {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .summary b { color: var(--fg); font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <span>🚴 自転車ログ</span>
    <span class="badge" id="apiStatus">接続待機</span>
  </header>

  <!-- Mode switch: 'record' for the new-entry form, 'routes' for the
       read-only map of every saved log. The two views share the same
       /bike-logs API and the same auth credentials; only the visible
       section changes. -->
  <div class="mode-tabs" id="modeTabs">
    <button type="button" class="mode-tab active" data-mode="record">新規記録</button>
    <button type="button" class="mode-tab" data-mode="routes">ルート詳細</button>
  </div>

  <main>
    <div id="authWait" class="card" style="display:none;">
      <h2>認証待ち</h2>
      <div class="empty">ホストアプリからの認証情報を待機しています...</div>
    </div>

    <div id="formCard" class="card">
      <h2>新しい記録</h2>
      <div class="row">
        <label for="date">日付</label>
        <input type="date" id="date" />
      </div>
      <div class="row">
        <label for="distance">距離 (km)</label>
        <input type="number" id="distance" inputmode="decimal" step="0.1" min="0" placeholder="例: 25.4" />
      </div>
      <div class="row">
        <label for="duration">時間 (分)</label>
        <input type="number" id="duration" inputmode="numeric" step="1" min="0" placeholder="例: 75" />
      </div>
      <div class="row">
        <label for="title">タイトル</label>
        <input type="text" id="title" placeholder="例: 草津〜京都" />
      </div>
      <div class="row">
        <label for="note">メモ</label>
        <textarea id="note" placeholder="天気・ルート・体調など"></textarea>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="ghost" id="gpsToggle">📍 GPS記録 開始</button>
        <span id="gpsState" style="font-size:12px;color:var(--muted);"></span>
      </div>
      <div id="map" style="display:none;"></div>
      <div class="stats" id="gpsStats" style="display:none;">
        <div class="stat"><div class="v" id="gpsDist">0.0</div><div class="u">km</div></div>
        <div class="stat"><div class="v" id="gpsTime">00:00</div><div class="u">time</div></div>
        <div class="stat"><div class="v" id="gpsSpd">0.0</div><div class="u">km/h</div></div>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="primary" id="saveBtn">保存</button>
      </div>
    </div>

    <div id="routeView" class="card" style="display:none;">
      <h2>ルート詳細</h2>
      <div id="routeStats" class="route-stats">
        <div class="stat empty"><div class="v">-</div><div class="u">距離 (km)</div></div>
        <div class="stat empty"><div class="v">-</div><div class="u">時間</div></div>
        <div class="stat empty"><div class="v">-</div><div class="u">平均 (km/h)</div></div>
        <div class="stat empty"><div class="v">-</div><div class="u">記録数</div></div>
      </div>
      <div style="display:flex; gap:6px; margin: 8px 0;">
        <button type="button" class="ghost" id="routeResetBtn" disabled>全件表示</button>
      </div>
      <div id="routeMap" class="route-map"></div>
      <div class="list-wrap" id="routeList">
        <div class="empty">読み込み中...</div>
      </div>
    </div>

    <div class="card">
      <h2>今月の記録</h2>
      <div class="summary" id="summary"></div>
      <div id="logList">
        <div class="empty">読み込み中...</div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    // ---- postMessage contract with the host (index.html) ----
    // Host -> child: { type: 'bike-credentials', apiBase, lineUserId?, idToken? }
    // Child -> host: { type: 'bike-ready' }
    // Host -> child: { type: 'bike-auth-error', message: '...' }
    const STATE = {
      apiBase: '',
      lineUserId: '',
      idToken: '',
      // Server-side session token issued by the host's /api/auth/login
      // against the employees table. Same bearer the bento tab uses; the
      // server enforces employees-table membership for /bike-logs and
      // /api/orders alike.
      authToken: '',
      authed: false,
      // Runtime tunables loaded from /api/config. Defaults match the server
      // fallback so the page works even if the fetch fails.
      config: {
        gps_sample_interval_ms: 180_000,  // 3 minutes
        bike_page_title: '自転車ログ',
      },
      logs: [],
      gps: {
        active: false,
        points: [],
        polyline: [],         // [[lat,lng], ...]
        startTs: 0,
        totalDistanceM: 0,
        lastPoint: null,
        map: null,
        marker: null,
        polyLayer: null,
        timer: null,            // GPS sample interval timer (3 minutes)
        displayTimer: null,     // UI stat refresh (1 second)
      },
    };

    function todayISO() {
      const d = new Date();
      const tz = d.getTimezoneOffset() * 60000;
      return new Date(d - tz).toISOString().slice(0, 10);
    }
    document.getElementById('date').value = todayISO();

    function showToast(msg, isError) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { el.className = 'toast' + (isError ? ' error' : ''); }, 2400);
    }

    function setStatus(text, ok) {
      const el = document.getElementById('apiStatus');
      el.textContent = text;
      el.style.color = ok ? '#bbf7d0' : '#fecaca';
    }

    // ---- postMessage handshake ----
    function start() {
      const params = new URLSearchParams(location.search);
      if (params.get('embedded') !== '1') {
        // Standalone / mock mode (open bike/index.html directly)
        STATE.apiBase = params.get('apiBase') || '';
        STATE.idToken = params.get('mockToken') || 'mock';
        STATE.lineUserId = params.get('mockUser') || 'demo-user';
        STATE.authed = true;
        onAuthed();
        return;
      }
      document.getElementById('authWait').style.display = 'block';
      document.getElementById('formCard').style.opacity = '0.5';
      setStatus('認証待ち', false);
      // Ask host for credentials. Host also re-posts on bento-ready, so this
      // handles the case where the iframe is mounted before the host boots.
      let attempts = 0;
      const ask = () => {
        attempts += 1;
        try {
          window.parent.postMessage({ type: 'bike-ready' }, '*');
        } catch (e) { /* parent may not be ready yet */ }
        if (attempts < 60) setTimeout(ask, 500);
        else showAuthFailure('ホストからの認証情報を取得できませんでした。タブを開き直してください。');
      };
      ask();
    }

    function showAuthFailure(msg) {
      STATE.authed = false;
      document.getElementById('authWait').style.display = 'block';
      document.getElementById('authWait').innerHTML =
        '<h2>認証エラー</h2><div class="empty" style="color:var(--danger);">' +
        msg + '</div>';
      setStatus('未接続', false);
    }

    window.addEventListener('message', (ev) => {
      const d = ev.data || {};
      if (d.type === 'bike-credentials') {
        if (!d.apiBase) { showAuthFailure('APIベースURLが指定されていません。'); return; }
        STATE.apiBase = d.apiBase;
        STATE.idToken = d.idToken || '';
        STATE.lineUserId = d.lineUserId || '';
        STATE.authToken = d.authToken || '';
        STATE.authed = true;
        onAuthed();
      } else if (d.type === 'bike-auth-error') {
        showAuthFailure(d.message || '認証に失敗しました。');
      }
    });

    function onAuthed() {
      document.getElementById('authWait').style.display = 'none';
      document.getElementById('formCard').style.opacity = '1';
      setStatus('接続済み', true);
      // Pull runtime tunables (GPS interval, page title) before the user
      // hits the start button — otherwise the first sample would be on the
      // hard-coded default and only later ticks would use the env-var value.
      // Path is /api/runtime-config (NOT /api/config) to avoid the bento
      // ordering app's /api/config collision.
      loadConfig();
      loadLogs();
    }

    async function loadConfig(retry) {
      retry = retry || 0;
      try {
        const r = await fetch(STATE.apiBase + '/api/runtime-config', {
          headers: authHeaders(),
          cache: 'no-store',
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (j && typeof j === 'object') {
          if (Number.isFinite(j.gps_sample_interval_ms) && j.gps_sample_interval_ms > 0) {
            GPS_SAMPLE_INTERVAL_MS = j.gps_sample_interval_ms;
            STATE.config.gps_sample_interval_ms = j.gps_sample_interval_ms;
          }
          if (typeof j.bike_page_title === 'string' && j.bike_page_title.trim()) {
            STATE.config.bike_page_title = j.bike_page_title.trim();
            document.title = STATE.config.bike_page_title;
            // Update the visible header on the page too — the static <h1>
            // cannot read env vars, so we patch it once after the fetch.
            const headerSpan = document.querySelector('header span');
            if (headerSpan) headerSpan.textContent = '🚴 ' + STATE.config.bike_page_title;
          }
        }
      } catch (e) {
        if (retry < 2) {
          await new Promise(res => setTimeout(res, 1000 * Math.pow(2, retry)));
          return loadConfig(retry + 1);
        }
        // Defaults already in place; the user can still use the page.
        console.warn('config fetch failed, using defaults:', e.message);
      }
    }

    // ---- API ----
    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (STATE.authToken) h['Authorization'] = 'Bearer ' + STATE.authToken;
      return h;
    }

    async function loadLogs(retry) {
      retry = retry || 0;
      let lastErr = '';
      try {
        const r = await fetch(STATE.apiBase + '/bike-logs', {
          headers: authHeaders(),
          cache: 'no-store',
        });
        if (!r.ok) {
          // Read the body so we can show a concrete reason. Without this
          // the user sees "HTTP 401" and cannot tell whether the issue is
          // a missing employees-table entry, an expired session, a Render
          // cold start, or something else entirely.
          let body = '';
          try { body = (await r.text()).slice(0, 240); } catch (e) { body = ''; }
          throw new Error('HTTP ' + r.status + (body ? ' ' + body : ''));
        }
        const j = await r.json();
        // Normalise polyline: stored as JSON string; some legacy rows may
        // already be a list. Accept both. Without this, every saved log
        // looks GPS-less to the route-detail map and selectRoute() never
        // finds anything to draw.
        STATE.logs = (j.logs || []).map(l => {
          let pl = l.polyline;
          if (typeof pl === 'string') {
            try { pl = JSON.parse(pl); } catch (e) { pl = []; }
          }
          if (!Array.isArray(pl)) pl = [];
          return Object.assign({}, l, { polyline: pl });
        });
        renderLogs();
        loadSummary();
        // If the user has the route-detail tab open already, repaint the
        // map now that fresh data arrived. Otherwise the next tab switch
        // will pick up the latest STATE.logs via renderRouteIfActive().
        renderRouteIfActive();
        return;
      } catch (e) {
        lastErr = e.message || String(e);
        if (retry < 3) {
          await new Promise(res => setTimeout(res, 1000 * Math.pow(2, retry)));
          return loadLogs(retry + 1);
        }
        STATE.logs = [];
        renderLogs();
        // Show the full error in the list area (toast disappears in 2.4s)
        // and a short version in the toast, so the user has a chance to
        // read either one.
        const listEl = document.getElementById('logList');
        if (listEl) {
          listEl.innerHTML = '<div class="empty" style="color:var(--danger);white-space:pre-wrap;word-break:break-all;font-size:12px;">'
            + '記録の読み込みに失敗しました。<br>詳細: ' + lastErr + '</div>';
        }
        showToast('記録の読み込みに失敗: ' + lastErr, true);
      }
    }

    async function loadSummary() {
      if (!STATE.idToken) return; // summary requires Postgres + auth
      const ym = todayISO().slice(0, 7);
      try {
        const r = await fetch(STATE.apiBase + '/bike-logs/summary/' + ym, {
          headers: authHeaders(),
          cache: 'no-store',
        });
        if (!r.ok) return;
        const j = await r.json();
        const el = document.getElementById('summary');
        el.innerHTML =
          '<div><b>' + (j.count || 0) + '</b> 回</div>' +
          '<div><b>' + (j.total_km || 0).toFixed(1) + '</b> km</div>' +
          '<div><b>' + Math.round((j.total_min || 0) / 60 * 10) / 10 + '</b> h</div>';
      } catch (e) { /* summary is best-effort */ }
    }

    function renderLogs() {
      const list = document.getElementById('logList');
      if (!STATE.logs.length) {
        list.innerHTML = '<div class="empty">まだ記録がありません</div>';
        return;
      }
      list.innerHTML = STATE.logs.map(function (l) {
        const dist = (l.distance_km || 0).toFixed(1);
        const dur = formatDuration(l.duration_min || 0);
        const t = (l.title || '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));
        const n = (l.note || '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));
        return '<div class="log-item">' +
          '<div class="info">' +
            '<div class="d">' + l.date + ' &nbsp; ' + dist + ' km / ' + dur + '</div>' +
            (t ? '<div class="n">' + t + '</div>' : '') +
            (n ? '<div class="m">' + n + '</div>' : '') +
          '</div>' +
          '<button class="ghost" data-del="' + l.id + '">削除</button>' +
        '</div>';
      }).join('');
      list.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          deleteLog(btn.getAttribute('data-del'));
        });
      });
    }

    function formatDuration(min) {
      const h = Math.floor(min / 60);
      const m = min % 60;
      return (h ? h + 'h' : '') + (m ? (h ? ' ' : '') + m + 'm' : '0m');
    }

    async function saveLog(payload) {
      try {
        const r = await fetch(STATE.apiBase + '/bike-logs', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(payload),
        });
        if (!r.ok) {
          const t = await r.text();
          throw new Error('HTTP ' + r.status + ' ' + t);
        }
        showToast('保存しました');
        loadLogs();
      } catch (e) {
        showToast('保存失敗: ' + e.message, true);
      }
    }

    async function deleteLog(id) {
      if (!confirm('この記録を削除しますか？')) return;
      try {
        const r = await fetch(STATE.apiBase + '/bike-logs/' + encodeURIComponent(id), {
          method: 'DELETE',
          headers: authHeaders(),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        showToast('削除しました');
        loadLogs();
      } catch (e) {
        showToast('削除失敗: ' + e.message, true);
      }
    }

    // ---- Save button ----
    document.getElementById('saveBtn').addEventListener('click', function () {
      const date = document.getElementById('date').value;
      const distance = parseFloat(document.getElementById('distance').value) || 0;
      const duration = parseInt(document.getElementById('duration').value, 10) || 0;
      const title = document.getElementById('title').value.trim();
      const note = document.getElementById('note').value.trim();
      if (!date) { showToast('日付を入力してください', true); return; }
      if (distance <= 0 && STATE.gps.polyline.length < 2) {
        showToast('距離を入力するか、GPS記録を使ってください', true); return;
      }
      const polyline = STATE.gps.polyline.length >= 2
        ? STATE.gps.polyline
        : [];
      // If GPS ran, prefer its measured distance/duration.
      let finalDist = distance;
      let finalDur = duration;
      if (STATE.gps.active || STATE.gps.polyline.length >= 2) {
        finalDist = Math.round((STATE.gps.totalDistanceM / 1000) * 100) / 100 || distance;
        finalDur = Math.round((Date.now() - STATE.gps.startTs) / 60000) || duration;
      }
      saveLog({
        date: date,
        distance_km: finalDist,
        duration_min: finalDur,
        title: title,
        note: note,
        polyline: polyline,
      });
    });

    // ---- GPS ----
    const gpsBtn = document.getElementById('gpsToggle');
    const gpsStateEl = document.getElementById('gpsState');

    gpsBtn.addEventListener('click', function () {
      if (STATE.gps.active) {
        stopGps();
      } else {
        startGps();
      }
    });

    // GPS sample interval. Default 3 minutes; overwritten by /api/config
    // when the page boots, so the Render env var GPS_SAMPLE_INTERVAL_MS
    // takes effect without a code change.
    let GPS_SAMPLE_INTERVAL_MS = 3 * 60 * 1000;

    function startGps() {
      if (!navigator.geolocation) {
        showToast('このブラウザはGPSに対応していません', true);
        return;
      }
      STATE.gps.active = true;
      STATE.gps.polyline = [];
      STATE.gps.totalDistanceM = 0;
      STATE.gps.lastPoint = null;
      STATE.gps.startTs = Date.now();
      // Take the first sample immediately so the polyline is not empty until
      // the first 3-minute tick fires, then keep sampling on a fixed interval.
      // watchPosition would give us continuous updates but at the cost of
      // battery and a polyline dense enough to dwarf the route-detail map.
      sampleGps();
      STATE.gps.timer = setInterval(sampleGps, GPS_SAMPLE_INTERVAL_MS);
      gpsBtn.textContent = '⏹ GPS記録 停止';
      gpsStateEl.textContent = '計測中...（3分ごとに記録）';
      document.getElementById('map').style.display = 'block';
      document.getElementById('gpsStats').style.display = 'grid';
      ensureMap();
      // The stat row updates every second (for elapsed time) so the user has
      // visual feedback while the GPS itself only fires every 3 minutes.
      STATE.gps.displayTimer = setInterval(updateGpsStats, 1000);
    }

    function stopGps() {
      STATE.gps.active = false;
      if (STATE.gps.timer) { clearInterval(STATE.gps.timer); STATE.gps.timer = null; }
      if (STATE.gps.displayTimer) { clearInterval(STATE.gps.displayTimer); STATE.gps.displayTimer = null; }
      gpsBtn.textContent = '📍 GPS記録 開始';
      gpsStateEl.textContent = STATE.gps.polyline.length + '点 / ' +
        (STATE.gps.totalDistanceM / 1000).toFixed(2) + ' km';
    }

    // One-shot getCurrentPosition. The page ignores subsequent samples when
    // the user has already stopped the ride, so the in-flight call from the
    // last 3-minute tick cannot append a phantom point after stopGps().
    function sampleGps() {
      if (!STATE.gps.active) return;
      navigator.geolocation.getCurrentPosition(onGpsPos, onGpsErr, {
        enableHighAccuracy: true,
        maximumAge: GPS_SAMPLE_INTERVAL_MS,
        timeout: 60000,
      });
    }

    function onGpsPos(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const p = [lat, lng];
      if (STATE.gps.lastPoint) {
        STATE.gps.totalDistanceM += haversineMeters(STATE.gps.lastPoint, p);
      }
      STATE.gps.lastPoint = p;
      STATE.gps.polyline.push(p);
      updateMap(p);
      // Reflect the latest successful fix in the header so the user has
      // visible confirmation between 3-minute ticks.
      gpsStateEl.textContent = '計測中（' + STATE.gps.polyline.length + '点 / 次回 3分後）';
    }

    function onGpsErr(err) {
      gpsStateEl.textContent = 'GPS取得失敗: ' + err.message;
    }

    function haversineMeters(a, b) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b[0] - a[0]);
      const dLng = toRad(b[1] - a[1]);
      const s = Math.sin(dLat/2) ** 2 +
        Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLng/2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    function ensureMap() {
      if (STATE.gps.map) return;
      const map = L.map('map', { zoomControl: false }).setView([35.0116, 135.7681], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19,
      }).addTo(map);
      STATE.gps.map = map;
      STATE.gps.polyLayer = L.polyline([], { color: '#16a34a', weight: 4 }).addTo(map);
    }

    function updateMap(p) {
      ensureMap();
      if (!STATE.gps.marker) {
        STATE.gps.marker = L.circleMarker(p, { radius: 6, color: '#16a34a', fillOpacity: 1 }).addTo(STATE.gps.map);
        STATE.gps.map.setView(p, 15);
      } else {
        STATE.gps.marker.setLatLng(p);
        STATE.gps.map.panTo(p);
      }
      STATE.gps.polyLayer.setLatLngs(STATE.gps.polyline);
    }

    function updateGpsStats() {
      const km = STATE.gps.totalDistanceM / 1000;
      const min = Math.floor((Date.now() - STATE.gps.startTs) / 60000);
      const h = Math.floor(min / 60);
      const m = min % 60;
      const spd = (min > 0) ? (km / (min / 60)) : 0;
      document.getElementById('gpsDist').textContent = km.toFixed(2);
      document.getElementById('gpsTime').textContent =
        (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
      document.getElementById('gpsSpd').textContent = spd.toFixed(1);
    }

    // ---- Route-detail view (read-only map of saved polylines) ----
    // Reuses the same /bike-logs fetch and the same auth headers. Lives
    // in the same STATE so a fresh log saved in the form immediately
    // shows up in the route view the next time the user switches tabs.
    const ROUTE = {
      map: null,
      allLayers: new Map(),  // id -> L.Polyline
      startEndMarkers: null,
      selectedId: null,
    };

    function ensureRouteMap() {
      if (ROUTE.map) return;
      const center = (STATE.config && STATE.config.route_map_default_center) || [35.0116, 135.7681];
      const zoom = (STATE.config && STATE.config.route_map_default_zoom) || 11;
      const m = L.map('routeMap', { zoomControl: true }).setView(center, zoom);
      m.setView = m.setView.bind(m);
      m.fitBounds = m.fitBounds.bind(m);
      m.removeLayer = m.removeLayer.bind(m);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19,
      }).addTo(m);
      ROUTE.map = m;
    }

    function drawAllRoutes() {
      if (!ROUTE.map) return;
      ROUTE.allLayers.forEach(layer => ROUTE.map.removeLayer(layer));
      ROUTE.allLayers.clear();
      const allBounds = [];
      STATE.logs.forEach(log => {
        if (!log.polyline || log.polyline.length < 2) return;
        const layer = L.polyline(log.polyline, {
          color: '#94a3b8',
          weight: 2,
          opacity: 0.55,
        }).addTo(ROUTE.map);
        ROUTE.allLayers.set(log.id, layer);
        log.polyline.forEach(p => allBounds.push(p));
      });
      if (allBounds.length >= 2 && !ROUTE.selectedId) {
        ROUTE.map.fitBounds(allBounds, { padding: [24, 24] });
      }
    }

    function selectRoute(logId) {
      const log = STATE.logs.find(l => l.id === logId);
      if (!log) return;
      ROUTE.selectedId = logId;
      ROUTE.allLayers.forEach((layer, id) => {
        if (id === logId) {
          layer.setStyle({ color: '#16a34a', weight: 5, opacity: 0.95 });
        } else {
          layer.setStyle({ color: '#cbd5e1', weight: 1, opacity: 0.4 });
        }
      });
      if (ROUTE.startEndMarkers) {
        ROUTE.startEndMarkers.forEach(m => ROUTE.map.removeLayer(m));
        ROUTE.startEndMarkers = null;
      }
      if (log.polyline && log.polyline.length >= 2) {
        const start = log.polyline[0];
        const end = log.polyline[log.polyline.length - 1];
        const startMarker = L.circleMarker(start, {
          radius: 7, color: '#16a34a', fillColor: '#fff', fillOpacity: 1, weight: 3,
        }).addTo(ROUTE.map);
        startMarker.addTo = () => startMarker;
        startMarker.bindTooltip = () => startMarker;
        const endMarker = L.circleMarker(end, {
          radius: 7, color: '#dc2626', fillColor: '#fff', fillOpacity: 1, weight: 3,
        }).addTo(ROUTE.map);
        endMarker.addTo = () => endMarker;
        endMarker.bindTooltip = () => endMarker;
        ROUTE.startEndMarkers = [startMarker, endMarker];
        ROUTE.map.fitBounds(log.polyline, { padding: [40, 40] });
      } else {
        showToast('この記録にはGPSデータがありません');
      }
      document.querySelectorAll('.route-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === logId);
      });
      const target = document.querySelector('.route-item[data-id="' + cssEscRoute(logId) + '"]');
      if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      updateRouteStats(log);
      document.getElementById('routeResetBtn').disabled = false;
    }

    function cssEscRoute(s) {
      if (window.CSS && CSS.escape) return CSS.escape(s);
      return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c);
    }

    function resetRouteView() {
      ROUTE.selectedId = null;
      ROUTE.allLayers.forEach((layer) => {
        layer.setStyle({ color: '#94a3b8', weight: 2, opacity: 0.55 });
      });
      if (ROUTE.startEndMarkers) {
        ROUTE.startEndMarkers.forEach(m => ROUTE.map.removeLayer(m));
        ROUTE.startEndMarkers = null;
      }
      document.querySelectorAll('.route-item.selected').forEach(el => el.classList.remove('selected'));
      const allBounds = [];
      ROUTE.allLayers.forEach(layer => {
        if (layer.getLatLngs) {
          layer.getLatLngs().forEach(p => allBounds.push(p));
        }
      });
      if (allBounds.length >= 2) {
        ROUTE.map.fitBounds(allBounds, { padding: [24, 24] });
      }
      updateRouteStats();
      document.getElementById('routeResetBtn').disabled = true;
    }

    function renderRouteList() {
      const wrap = document.getElementById('routeList');
      if (!STATE.logs.length) {
        wrap.innerHTML = '<div class="empty">まだ記録がありません。<br>「新規記録」タブから追加してください。</div>';
        return;
      }
      const groups = new Map();
      STATE.logs.forEach(l => {
        const ym = (l.date || '').slice(0, 7);
        if (!groups.has(ym)) groups.set(ym, []);
        groups.get(ym).push(l);
      });
      const ymKeys = Array.from(groups.keys()).sort().reverse();
      let html = '';
      ymKeys.forEach(ym => {
        const items = groups.get(ym).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        html += '<div class="month-label">' + escRoute(ym) + '</div>';
        items.forEach(l => {
          const hasGps = l.polyline && l.polyline.length >= 2;
          html += '<div class="route-item" data-id="' + escRoute(l.id) + '">' +
            '<div class="info">' +
              '<div class="date">' + escRoute(l.date || '(日付なし)') + '</div>' +
              '<div class="meta">' + formatDuration(l.duration_min || 0) +
                (l.avg_speed_kmh ? ' / ' + l.avg_speed_kmh.toFixed(1) + ' km/h' : '') +
              '</div>' +
              (l.title ? '<div class="title">' + escRoute(l.title) + '</div>' : '') +
              (hasGps ? '' : '<div class="no-gps">GPSデータなし</div>') +
            '</div>' +
            '<div class="km">' + (l.distance_km || 0).toFixed(1) + '<br><span style="font-size:10px;font-weight:400;">km</span></div>' +
          '</div>';
        });
      });
      wrap.innerHTML = html;
      wrap.querySelectorAll('.route-item').forEach(el => {
        el.addEventListener('click', () => selectRoute(el.dataset.id));
      });
    }

    function escRoute(s) {
      return String(s || '').replace(/[<>&"']/g, c => ({
        '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function updateRouteStats(log) {
      const stats = document.getElementById('routeStats');
      if (log) {
        const dur = formatDuration(log.duration_min || 0);
        const km = (log.distance_km || 0).toFixed(1);
        const spd = (log.avg_speed_kmh || 0).toFixed(1);
        stats.innerHTML =
          '<div class="stat"><div class="v">' + km + '</div><div class="u">km</div></div>' +
          '<div class="stat"><div class="v">' + dur + '</div><div class="u">時間</div></div>' +
          '<div class="stat"><div class="v">' + spd + '</div><div class="u">km/h</div></div>' +
          '<div class="stat empty"><div class="v">1</div><div class="u">選択中</div></div>';
      } else {
        const totalKm = STATE.logs.reduce((s, l) => s + (l.distance_km || 0), 0);
        const totalMin = STATE.logs.reduce((s, l) => s + (l.duration_min || 0), 0);
        const withGps = STATE.logs.filter(l => l.polyline && l.polyline.length >= 2).length;
        const avg = totalMin > 0 ? (totalKm / (totalMin / 60)) : 0;
        stats.innerHTML =
          '<div class="stat"><div class="v">' + totalKm.toFixed(1) + '</div><div class="u">合計km</div></div>' +
          '<div class="stat"><div class="v">' + formatDuration(totalMin) + '</div><div class="u">合計時間</div></div>' +
          '<div class="stat"><div class="v">' + avg.toFixed(1) + '</div><div class="u">平均km/h</div></div>' +
          '<div class="stat"><div class="v">' + STATE.logs.length +
            '<span style="font-size:10px;color:var(--muted);"> (GPS ' + withGps + ')</span></div>' +
          '<div class="u">記録数</div></div>';
      }
    }

    function renderRouteIfActive() {
      // The map is hidden when the form view is shown — Leaflet needs an
      // invalidateSize() after becoming visible, otherwise it draws blank
      // tiles in a 0×0 container. Call this whenever the route view
      // becomes visible.
      if (document.getElementById('routeView').style.display === 'none') return;
      renderRouteList();
      ensureRouteMap();
      drawAllRoutes();
      updateRouteStats();
      // Defer one frame so Leaflet sees the new container size.
      requestAnimationFrame(() => {
        if (ROUTE.map) ROUTE.map.invalidateSize();
      });
    }

    // ---- Mode tab switching ----
    document.querySelectorAll('.mode-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        document.querySelectorAll('.mode-tab').forEach(b => b.classList.toggle('active', b === btn));
        if (mode === 'record') {
          document.getElementById('formCard').style.display = '';
          const formCard = document.getElementById('formCard');
          // The formCard sits at the top; show it and hide the route view.
          // (The "今月の記録" card stays visible in both modes.)
          document.getElementById('routeView').style.display = 'none';
          // Show the GPS section (id="map") only if it was already open.
          if (STATE.gps && STATE.gps.active) {
            document.getElementById('map').style.display = 'block';
            document.getElementById('gpsStats').style.display = 'grid';
          }
        } else if (mode === 'routes') {
          document.getElementById('routeView').style.display = '';
          // Hide the formCard + map + GPS stats so the route view owns the
          // vertical space. The "今月の記録" card is still visible.
          document.getElementById('formCard').style.display = 'none';
          if (STATE.gps) {
            // Pause GPS sampling while the form is hidden? No — GPS is the
            // user's explicit action. We just hide the live map view; the
            // route view shows saved routes, not the current one.
          }
          renderRouteIfActive();
        }
      });
    });

    document.getElementById('routeResetBtn').addEventListener('click', resetRouteView);

    // ---- Boot ----
    start();
  </script>
</body>
</html>
