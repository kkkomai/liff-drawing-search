      for (var i = 0; i < tabs.length; i++) {
        tabs[i].className = 'tab';
      }
      var targetTab = document.querySelector('#tab-' + tabName + '-btn');
      if (targetTab) {
        targetTab.className = 'tab active';
      }
      console.log('switchTab: showing ' + tabName);
      console.log('switchTab called: ' + tabName);
      if (tabName === 'bento') ensureBentoFrame();
      if (tabName === 'bike') ensureBikeFrame();
      if (tabName === 'weather') {
        if (!weatherTabLoaded) {
          weatherTabLoaded = true;
          loadWeatherTab();
        }
      }
      if (tabName === 'paid' && typeof loadPaidHistories === 'function') {
        try { loadPaidHistories(); } catch (e) { log('loadPaidHistories failed: ' + e.message, true); }
      }
    }

    // === BENTO TAB (iframe + postMessage credential handoff) ===
    // お弁当注文バックエンドの公開ベースURL。1箇所だけ直せば全タブに効く。
    // 空文字なら同一オリジン運用（bento をこのサーバーと同じホストに配る場合）。
    var BENTO_API_BASE = '';
    // liff.init can only run once per document, so embedded tabs (bento, bike)
    // cannot initialise LIFF themselves. The host reads the token ONCE and
    // hands it to every child via postMessage, with the same payload shape.
    function buildLiffCredentials() {
      var p = { lineUserId: null, idToken: null, error: null };
      try { p.lineUserId = liff.getContext().userId || null; } catch (e) { p.lineUserId = null; }
      try {
        var decoded = liff.getDecodedIDToken();
        p.idToken = decoded && decoded.jwt ? decoded.jwt : null;
      } catch (e) {
        p.idToken = null;
        p.error = (e && (e.message || e.code || e.name)) || String(e);
      }
      return p;
    }
    function ensureBentoFrame() {
      var frame = document.getElementById('bento-frame');
      if (!frame) return;
      // The frame may already be primed (src set) but the iframe failed to
      // boot (e.g. a previous auth attempt). Only skip the src assignment,
      // never skip the credential hand-off.
      if (frame.dataset.loaded !== '1') {
        // The bento backend runs on its own origin. Single source of truth is
        // BENTO_API_BASE; ?bentoApi= overrides it for local verification only.
        var api = new URLSearchParams(window.location.search).get('bentoApi') || BENTO_API_BASE;
        frame.src = frame.dataset.src + (api ? ('&bentoApi=' + encodeURIComponent(api)) : '');
        frame.dataset.loaded = '1';
        log('ensureBentoFrame: loading ' + frame.src);
      }
      sendBentoCredentials();
    }

    function sendBentoCredentials() {
      var frame = document.getElementById('bento-frame');
      if (!frame || !frame.contentWindow) return;
      var payload = {
        type: 'bento-credentials',
        lineUserId: null,
        idToken: null,
        authToken: getAuthToken(),
      };
      try {
        payload.lineUserId = liff.getContext().userId || null;
      } catch (e) {
        payload.lineUserId = null;
      }
      try {
        var decoded = liff.getDecodedIDToken();
        payload.idToken = decoded && decoded.jwt ? decoded.jwt : null;
      } catch (e) {
        // Swallowing this used to hide the real reason. getDecodedIDToken()
        // throws when the openid scope is missing or was never saved in the
        // LIFF console, and that message is the only actionable clue — the
        // backend then rejects login with "id_token がありません", which points
        // at the server when the fault is a console setting.
        payload.idToken = null;
        window.__idTokenError = (e && (e.message || e.code || e.name)) || String(e);
        diag('4. IDトークン', '取得失敗: ' + window.__idTokenError);
        log('sendBentoCredentials: getDecodedIDToken failed: ' + window.__idTokenError, true);
      }
      // A decoded token with an empty jwt means the same thing as a throw, and
      // it would otherwise be reported as merely "idToken=なし".
      if (!payload.idToken && !window.__idTokenError) {
        window.__idTokenError = 'getDecodedIDToken() は成功しましたが jwt が空でした。';
        diag('4. IDトークン', window.__idTokenError);
      }
      if (!payload.lineUserId) {
        // liff.init has not finished yet. The iframe asked before the SDK was
        // ready, so retry on a timer instead of dropping the request.
        diag('3. 認証情報', 'userId 未取得（リトライ中）');
        log('sendBentoCredentials: LIFF not ready yet, retrying');
        scheduleBentoCredentials();
        return;
      }
      // Distinguish "no userId" from "userId but no ID token". Only the latter
      // means the openid scope is missing, and only that case needs a console
      // fix rather than a longer wait — reporting both as one generic retry
      // sent us chasing cold starts when the scope was the real problem.
      diag('3. 認証情報', 'userId=' + payload.lineUserId +
           ' / idToken=' + (payload.idToken ? 'あり' : 'なし') +
           ' / inClient=' + (typeof liff !== 'undefined' && liff.isInClient ? liff.isInClient() : '?') +
           ' / loggedIn=' + (typeof liff !== 'undefined' && liff.isLoggedIn ? liff.isLoggedIn() : '?'));
      // Report WHICH LIFF app the SDK actually booted. If this differs from the
      // id passed to liff.init, the scope being edited in the LINE console
      // belongs to a different app — which looks exactly like "scope ignored"
      // from inside the page, and cannot be told apart from a real scope bug.
      try {
        diag('3a. 実LIFF ID', liff.id || '(空)');
      } catch (e) { /* older SDKs may not expose liff.id */ }
      // The full decoded object, not just the jwt. A missing/empty jwt with
      // everything else populated means "no openid in this context"; anything
      // else means the SDK is in a state we have not accounted for.
      try {
        var _full = liff.getDecodedIDToken();
        diag('3b. 復号結果', 'keys=' + Object.keys(_full || {}).join(',') +
             ' / jwt=' + ((_full && _full.jwt) ? String(_full.jwt).length + '文字' : '空'));
      } catch (e2) {
        diag('3b. 復号結果', '例外: ' + (e2 && e2.message ? e2.message : e2));
      }
      // liff.idToken() is the documented accessor for the raw, signed token.
      // getDecodedIDToken() returned raw claims with no `jwt`, which is the
      // shape LIFF produces when openid was not granted — so ask the token
      // endpoint directly and report aud/iss, which tell us whether the token
      // was issued for THIS channel and issuer.
      try {
        var _raw = (typeof liff.idToken === 'function') ? liff.idToken() : null;
        diag('3c. 生トークン', _raw ? String(_raw).length + '文字 / ' + String(_raw).slice(0, 24) + '...' : 'なし');
        if (_raw) {
          var _p = JSON.parse(atob(String(_raw).split('.')[1] || ''));
          diag('3d. クレーム', 'aud=' + _p.aud + ' / iss=' + _p.iss + ' / nonce=' + (_p.nonce || '(なし)'));
        }
      } catch (e3) {
        diag('3c. 生トークン', '例外: ' + (e3 && e3.message ? e3.message : e3));
      }
      frame.contentWindow.postMessage(payload, window.location.origin);
      log('sendBentoCredentials: sent to bento iframe');
    }

    // The iframe can ask for credentials long before liff.init resolves, so keep
    // trying briefly. Bounded so a genuine auth failure still surfaces as an
    // error inside the iframe instead of an endless silent retry.
    var bentoRetryTimer = null;
    // 300ms x 200 = 60s, matching the initLiff budget below. The original 20
    // (6s) expired before a cold liff.init() finished loading the SDK, so the
    // iframe showed "LINE認証が必要です" on a perfectly healthy app; 60s also
    // outlasts a cold Render boot, which needs ~50s just to start.
    var BENTO_MAX_RETRIES = 200;
    var bentoRetries = 0;
    // Explain WHY LIFF is unusable, rather than always saying the same thing.
    // initLiff() records the concrete failure; without this the user sees one
    // generic message whether the cause is a wrong liff id, an SDK that never
    // loaded, or a scope change that was never saved in the console.
    function whyLiffUnavailable() {
      if (window.__liffInitError) return window.__liffInitError;
      if (typeof liff === 'undefined') return 'LINE LIFF SDK が読み込まれていません。';
      return 'LINE の認証が完了しませんでした（liff.init が未解決または失敗）。';
    }
    function scheduleBentoCredentials() {
      if (bentoRetryTimer) return;
      if (bentoRetries >= BENTO_MAX_RETRIES) {
        log('sendBentoCredentials: giving up after ' + bentoRetries + ' retries', true);
        // Tell the iframe why it is stuck. Without this the iframe keeps its
        // splash on screen forever, because the host simply goes quiet.
        try {
          var stuckFrame = document.getElementById('bento-frame');
          if (stuckFrame && stuckFrame.contentWindow) {
            stuckFrame.contentWindow.postMessage({
              type: 'bento-auth-error',
              message: whyLiffUnavailable()
            }, window.location.origin);
          }
        } catch (e) {
          log('sendBentoCredentials: could not deliver auth error: ' + e.message, true);
        }
        return;
      }
      bentoRetries++;
      bentoRetryTimer = setTimeout(function () {
        bentoRetryTimer = null;
        sendBentoCredentials();
      }, 300);
    }
    function resetBentoCredentials() {
      bentoRetries = 0;
    }

    // The iframe asks for credentials once it boots; answer immediately.
    window.addEventListener('message', function (ev) {
      if (!ev.data || !ev.data.type) return;
      if (ev.data.type === 'bento-ready') {
        log('bento iframe requested credentials');
        sendBentoCredentials();
        return;
      }
      if (ev.data.type === 'bike-ready') {
        log('bike iframe requested credentials');
        sendBikeCredentials();
        return;
      }
    });

    // === WEATHER TAB (inlined, not iframe) ===
    // We render the forecast directly into the host page instead of an
    // iframe because navigator.geolocation silently hangs inside iframes
    // on iOS LINE WebView — the OS prompt never appears. Hosting the
    // page in the top-level LIFF document restores the normal geolocation
    // flow (prompt, accept/deny, callback).
    var WEATHER_DEFAULT = { latitude: 35.0116, longitude: 135.7681 };
    var weatherTabLoaded = false;
    var weatherData = null;

    function loadWeatherTab() {
      // Render the tab skeleton. The "now loading" state gives the user
      // immediate feedback even before geolocation resolves.
      var root = document.getElementById('weather-root');
      if (!root) return;
      root.innerHTML =
        '<div class="card">' +
          '<h2 id="weather-status-h">現在地の天気</h2>' +
          '<div id="weather-current"></div>' +
        '</div>' +
        '<div class="card">' +
          '<h2>今後16日</h2>' +
          '<div class="weather-scroller" id="weather-daily"></div>' +
        '</div>' +
        '<div class="card" id="weather-detail-card" style="display:none;">' +
          '<h2 id="weather-detail-title">-- の時間帯別</h2>' +
          '<div id="weather-detail-body"></div>' +
        '</div>';

      // Geolocation must be triggered from a user gesture on iOS
      // Safari/WebView — calling it directly from a script tag or a
      // tab-switch handler silently no-ops. Show a button that
      // resolves the position on tap. If the user has already granted
      // permission (or wants the Kusatsu default), the buttons let
      // them pick the path without blocking the forecast.
      var currentEl = document.getElementById('weather-current');
      currentEl.innerHTML =
        '<div style="text-align:center;padding:16px 8px;">' +
          '<div style="margin-bottom:12px;color:var(--muted);">位置情報の利用にはボタンでの操作が必要です</div>' +
          '<button type="button" class="weather-cta" id="weather-locate-btn">📍 現在地の天気を取得</button>' +
          ' <button type="button" class="weather-cta secondary" id="weather-default-btn">草津駅の天気を表示</button>' +
        '</div>';

      var locateBtn = document.getElementById('weather-locate-btn');
      var defaultBtn = document.getElementById('weather-default-btn');
      if (locateBtn) {
        locateBtn.addEventListener('click', function () { doGeolocate(); });
      }
      if (defaultBtn) {
        defaultBtn.addEventListener('click', function () {
          document.getElementById('weather-status-h').textContent = '現在地の天気（草津駅の固定値）';
          fetchWeather(WEATHER_DEFAULT.latitude, WEATHER_DEFAULT.longitude);
        });
      }
    }

    function doGeolocate() {
      if (!navigator.geolocation) {
        showWeatherError('このブラウザは位置情報に対応していません');
        return;
      }
      document.getElementById('weather-status-h').textContent = '現在地の天気（位置情報を取得中...）';
      var fired = false;
      var fallback = setTimeout(function () {
        if (fired) return;
        fired = true;
        showWeatherError('位置情報の取得がタイムアウトしました。');
      }, 10000);
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          if (fired) return;
          fired = true;
          clearTimeout(fallback);
          fetchWeather(pos.coords.latitude, pos.coords.longitude);
        },
        function (err) {
          if (fired) return;
          fired = true;
          clearTimeout(fallback);
          showWeatherError('位置情報を取得できませんでした: ' + (err.message || err.code || 'unknown'));
        },
        { enableHighAccuracy: false, maximumAge: 5 * 60 * 1000, timeout: 8000 }
      );
    }

    function showWeatherError(msg) {
      var currentEl = document.getElementById('weather-current');
      if (!currentEl) return;
      // Render the error inline and offer the Kusatsu fallback as a
      // tap target so the user can always see a forecast.
      currentEl.innerHTML =
        '<div style="text-align:center;padding:12px 8px;color:var(--bad);">' + escHtml(msg) + '</div>' +
        '<div style="text-align:center;margin-top:8px;">' +
          '<button type="button" class="weather-cta secondary" id="weather-fallback-btn">草津駅の天気を表示</button>' +
        '</div>';
      var fb = document.getElementById('weather-fallback-btn');
      if (fb) {
        fb.addEventListener('click', function () {
          document.getElementById('weather-status-h').textContent = '現在地の天気（草津駅の固定値）';
          fetchWeather(WEATHER_DEFAULT.latitude, WEATHER_DEFAULT.longitude);
        });
      }
    }

    function fetchWeather(lat, lng) {
      // The /api/weather endpoint is not auth-gated (it is a public
      // proxy), so we send only the position query. The host page's
      // /schedules and /bike-logs still require a Bearer token; weather
      // does not, and adding an Authorization header here would only
      // muddle the failure mode if a 401 ever appeared.
      var url = '/api/weather?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng);
      fetch(url, { cache: 'no-store' })
        .then(function (r) {
          return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
        })
        .then(function (resp) {
          if (!resp.ok) {
            var detail = (resp.j && (resp.j.detail || (resp.j.detail && resp.j.detail.message))) || JSON.stringify(resp.j);
            throw new Error('HTTP ' + resp.status + ' ' + detail);
          }
          weatherData = resp.j;
          renderWeather(weatherData, lat, lng);
        })
        .catch(function (e) {
          document.getElementById('weather-current').innerHTML =
            '<div class="empty" style="color:var(--bad);">天気予報を取得できませんでした: ' + (e.message || e) + '</div>';
        });
    }

    var WMO_CODES = (function () {
      var m = {};
      m[0] = { icon: '☀️', label: '快晴' };
      m[1] = { icon: '🌤️', label: '晴れ' };
      m[2] = { icon: '⛅', label: '曇り時々晴' };
      m[3] = { icon: '☁️', label: '曇り' };
      [45, 48].forEach(function (c) { m[c] = { icon: '🌫️', label: '霧' }; });
      [51, 53, 55].forEach(function (c) { m[c] = { icon: '🌦️', label: '霧雨' }; });
      [56, 57].forEach(function (c) { m[c] = { icon: '🌧️', label: '凍る霧雨' }; });
      [61, 63, 65].forEach(function (c) { m[c] = { icon: '🌧️', label: '雨' }; });
      [66, 67].forEach(function (c) { m[c] = { icon: '🌧️', label: '凍る雨' }; });
      [71, 73, 75].forEach(function (c) { m[c] = { icon: '🌨️', label: '雪' }; });
      m[77] = { icon: '🌨️', label: 'ひょう' };
      [80, 81, 82].forEach(function (c) { m[c] = { icon: '🌦️', label: 'にわか雨' }; });
      [85, 86].forEach(function (c) { m[c] = { icon: '🌨️', label: 'にわか雪' }; });
      m[95] = { icon: '⛈️', label: '雷雨' };
      [96, 99].forEach(function (c) { m[c] = { icon: '⛈️', label: '雷雨(雹)' }; });
      return m;
    })();
    function wmoLookup(code) {
      return WMO_CODES[code] || { icon: '🌡️', label: '不明' };
    }
    function degToCompass(deg) {
      if (deg == null) return '';
      var dirs = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
      return dirs[Math.round(((deg % 360) / 45)) % 8];
    }
    function rideVerdict(day) {
      var rain = day.precipitation_probability_max || 0;
      var wind = day.wind_speed_10m_max || 0;
      if (rain >= 60 || wind >= 8 || (day.weather_code >= 61 && day.weather_code <= 99)) {
        return { cls: 'verdict-bad', label: '× 困難' };
      }
      if (rain >= 30 || wind >= 5) {
        return { cls: 'verdict-warn', label: '△ 風雨注意' };
      }
      return { cls: 'verdict-good', label: '◎ 良好' };
    }
    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[<>&"']/g, function (c) {
        return { '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;' }[c];
      });
    }

    function renderWeather(j, lat, lng) {
      var f = j.forecast || {};
      var c = f.current || {};
      var d = f.daily || {};
      // The server attaches a reverse-geocoded place name when the
      // Nominatim lookup succeeds. Prefer it; fall back to the
      // raw lat/lng pair so the user always knows where the
      // forecast is for.
      var placeName = j.place_name || null;
      var d0 = {
        code: (c.weather_code !== undefined) ? c.weather_code : (d.weather_code ? d.weather_code[0] : 0),
        temp: c.temperature_2m,
        wind: c.wind_speed_10m,
        windDir: c.wind_direction_10m,
        rain: (d.precipitation_probability_max && d.precipitation_probability_max[0] !== undefined)
              ? d.precipitation_probability_max[0] : null,
      };
      var w = wmoLookup(d0.code);
      var currentHtml =
        '<div class="current-grid">' +
          '<div class="current-cell current-summary">' +
            '<div class="current-icon">' + w.icon + '</div>' +
            '<div>' + escHtml(w.label) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="current-cell" style="margin-bottom:8px;">' +
              '<div class="label">気温 / 風速</div>' +
              '<div class="value">' + (d0.temp != null ? d0.temp.toFixed(1) : '--') + '<span class="unit">℃</span></div>' +
              '<div class="value" style="font-size:14px;">' + (d0.wind != null ? d0.wind.toFixed(1) : '--') + '<span class="unit">m/s</span>' +
              (d0.windDir != null ? ' (' + degToCompass(d0.windDir) + ')' : '') + '</div>' +
            '</div>' +
            '<div class="current-cell">' +
              '<div class="label">降水 / 位置</div>' +
              '<div class="value" style="font-size:14px;">' + (d0.rain != null ? d0.rain : '--') + '<span class="unit">%</span></div>' +
              '<div class="value" style="font-size:13px;color:var(--fg);font-weight:600;">' + escHtml(placeName || (lat.toFixed(3) + ', ' + lng.toFixed(3))) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.getElementById('weather-current').innerHTML = currentHtml;
      // Reflect the resolved place name in the section title too, so
      // the heading "現在地の天気" becomes "現在地の天気 — 京都市".
      var statusEl = document.getElementById('weather-status-h');
      if (statusEl) {
        var label = placeName || (lat.toFixed(3) + ', ' + lng.toFixed(3));
        statusEl.textContent = '現在地の天気 — ' + label;
      }

      // Daily scroller.
      var times = d.time || [];
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      var dailyHtml = '';
      for (var i = 0; i < times.length; i++) {
        var dt = new Date(times[i] + 'T00:00:00');
        var isToday = dt.getTime() === today.getTime();
        var day = {
          weather_code: (d.weather_code || [])[i],
          temperature_2m_max: (d.temperature_2m_max || [])[i],
          temperature_2m_min: (d.temperature_2m_min || [])[i],
          precipitation_probability_max: (d.precipitation_probability_max || [])[i],
          wind_speed_10m_max: (d.wind_speed_10m_max || [])[i],
        };
        var ww = wmoLookup(day.weather_code);
        var v = rideVerdict(day);
        dailyHtml +=
          '<div class="weather-day-card' + (isToday ? ' today' : '') + '" data-idx="' + i + '">' +
            '<div class="date">' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</div>' +
            '<div class="weekday">' + (isToday ? '今日' : weekdays[dt.getDay()]) + '</div>' +
            '<div class="icon">' + ww.icon + '</div>' +
            '<div class="temps"><span class="max">' + (day.temperature_2m_max != null ? Math.round(day.temperature_2m_max) : '?') + '°</span> / <span class="min">' + (day.temperature_2m_min != null ? Math.round(day.temperature_2m_min) : '?') + '°</span></div>' +
            '<div class="rain">☔ ' + (day.precipitation_probability_max != null ? day.precipitation_probability_max : '?') + '%</div>' +
            '<div class="wind">💨 ' + (day.wind_speed_10m_max != null ? day.wind_speed_10m_max.toFixed(1) : '?') + ' m/s</div>' +
            '<div class="verdict ' + v.cls + '">' + v.label + '</div>' +
          '</div>';
      }
      document.getElementById('weather-daily').innerHTML = dailyHtml;
      // Wire up click handlers.
      var cards = document.querySelectorAll('.weather-day-card');
      for (var k = 0; k < cards.length; k++) {
        (function (idx) {
          cards[k].addEventListener('click', function () { renderWeatherDetail(idx); });
        })(k);
      }
      // Default: show today's hourly detail.
      if (times.length) renderWeatherDetail(0);
    }

    function renderWeatherDetail(i) {
      var f = (weatherData && weatherData.forecast) || {};
      var d = f.daily || {};
      var h = f.hourly || {};
      var time = (d.time || [])[i];
      if (!time) return;
      // Highlight the selected card and scroll it into view.
      var cards = document.querySelectorAll('.weather-day-card');
      for (var k = 0; k < cards.length; k++) {
        cards[k].classList.toggle('selected', k === i);
      }
      var target = document.querySelector('.weather-day-card[data-idx="' + i + '"]');
      if (target && target.scrollIntoView) {
        target.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      }
      var dt = new Date(time + 'T00:00:00');
      var weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var isToday = dt.getTime() === today.getTime();
      var titleText = (isToday ? '今日 ' : '') + (dt.getMonth() + 1) + '/' + dt.getDate() + ' (' + weekdays[dt.getDay()] + ')';
      document.getElementById('weather-detail-title').textContent = titleText + ' の時間帯別';
      var hourlyTimes = h.time || [];
      var rows = [];
      for (var j = 0; j < hourlyTimes.length; j++) {
        var ht = new Date(hourlyTimes[j]);
        if (ht.getFullYear() !== dt.getFullYear() || ht.getMonth() !== dt.getMonth() || ht.getDate() !== dt.getDate()) continue;
        rows.push({ hour: ht.getHours(), temp: h.temperature_2m[j], rain: h.precipitation_probability[j], wind: h.wind_speed_10m[j], code: h.weather_code[j] });
      }
      var body = '';
      for (var hh = 0; hh < 24; hh += 3) {
        var slice = rows.filter(function (r) { return r.hour >= hh && r.hour < hh + 3; });
        if (!slice.length) continue;
        var tempAvg = 0; for (var s = 0; s < slice.length; s++) tempAvg += (slice[s].temp || 0); tempAvg /= slice.length;
        var rainMax = 0; for (var s = 0; s < slice.length; s++) rainMax = Math.max(rainMax, slice[s].rain || 0);
        var windMax = 0; for (var s = 0; s < slice.length; s++) windMax = Math.max(windMax, slice[s].wind || 0);
        var codeMid = slice[Math.floor(slice.length / 2)].code;
        var ww = wmoLookup(codeMid);
        var verdict = (rainMax >= 60 || windMax >= 8) ? '×' : (rainMax >= 30 || windMax >= 5) ? '△' : '◎';
        body += '<div class="detail-row">' +
          '<span class="label">' + ('0' + hh).slice(-2) + ':00 ' + ww.icon + ' ' + ww.label + ' ' + verdict + '</span>' +
          '<span class="value">' +
            (tempAvg != null ? tempAvg.toFixed(1) + '℃' : '--') +
            ' / ☔' + Math.round(rainMax) + '%' +
            ' / 💨' + windMax.toFixed(1) + 'm/s' +
          '</span></div>';
      }
      document.getElementById('weather-detail-body').innerHTML = body;
      document.getElementById('weather-detail-card').style.display = '';
    }

    function ensureBikeFrame() {
      var frame = document.getElementById('bike-frame');
      if (!frame) return;
      if (frame.dataset.loaded !== '1') {

        // so no apiBase override is needed; the child reads its own location.
        frame.src = frame.dataset.src;

    function sendBikeCredentials() {
      var frame = document.getElementById('bike-frame');
      if (!frame || !frame.contentWindow) return;
      var cred = buildLiffCredentials();
      if (!cred.lineUserId) {
        diag('3b. 自転車ログ', 'userId 未取得（リトライ中）');
        scheduleBikeCredentials();
        return;
      }
      var payload = {
        type: 'bike-credentials',
        lineUserId: cred.lineUserId,
        idToken: cred.idToken,
        authToken: getAuthToken(),
        apiBase: window.location.origin,
      };
      frame.contentWindow.postMessage(payload, window.location.origin);
      log('sendBikeCredentials: sent to bike iframe');
    }

    function scheduleBikeCredentials() {
      if (bikeRetryTimer) return;
      if (bikeRetries >= BIKE_MAX_RETRIES) {
        log('sendBikeCredentials: giving up after ' + bikeRetries + ' retries', true);
        try {
          var stuck = document.getElementById('bike-frame');
          if (stuck && stuck.contentWindow) {
            stuck.contentWindow.postMessage({
              type: 'bike-auth-error',
              message: whyLiffUnavailable(),
            }, window.location.origin);
          }
        } catch (e) {
          log('sendBikeCredentials: could not deliver auth error: ' + e.message, true);
        }
        return;
      }
      bikeRetries++;
      bikeRetryTimer = setTimeout(function () {

    var editorState = { rotation: 0, scale: 1, offsetX: 0, offsetY: 0, image: null, aspectRatio: 4/3, trimMode: false };

    function getCropRect() {
      var canvas = document.getElementById('editor-canvas');
      var container = document.getElementById('editor-container');
      if (!canvas || !container || !editorState.image) return null;
      var cw = container.clientWidth;
      var ch = container.clientHeight;
      var ar = editorState.aspectRatio;
      var cropW, cropH;
      if (cw / ch > ar) {
        cropH = ch * 0.85;
        cropW = cropH * ar;
      } else {
        cropW = cw * 0.85;
        cropH = cropW / ar;
      }
      return {
        x: (cw - cropW) / 2,
        y: (ch - cropH) / 2,
        w: cropW,
        h: cropH,
        cx: cw / 2,
        cy: ch / 2
      };
    }

    function drawEditor() {
      if (!editorState.image) return;
      var canvas = document.getElementById('editor-canvas');
      var ctx = canvas.getContext('2d');
      var container = document.getElementById('editor-container');
      if (!canvas || !ctx || !container) return;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      var cw = canvas.width;
      var ch = canvas.height;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, cw, ch);
      ctx.save();
      var crop = getCropRect();
      if (crop) {
        ctx.translate(crop.cx + editorState.offsetX, crop.cy + editorState.offsetY);
      } else {
        ctx.translate(cw / 2 + editorState.offsetX, ch / 2 + editorState.offsetY);
      }
      ctx.rotate(editorState.rotation * Math.PI / 180);
      ctx.scale(editorState.scale, editorState.scale);
      ctx.drawImage(editorState.image, -editorState.image.width / 2, -editorState.image.height / 2);
      ctx.restore();
      if (crop) {
        ctx.strokeStyle = '#00b900';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(0, 0, cw, crop.y);
        ctx.fillRect(0, crop.y + crop.h, cw, ch - crop.y - crop.h);
        ctx.fillRect(0, crop.y, crop.x, crop.h);
        ctx.fillRect(crop.x + crop.w, crop.y, cw - crop.x - crop.w, crop.h);
      }
    }

            if (!adjustImage || !adjustCanvas || !adjustState) {
              log('Apply cancelled: no image loaded');
              return;
            }
            // Compute crop in screen space (canvas pixels)
            var canvas = adjustCanvas;
            var cw = canvas.width;
            var ch = canvas.height;
            var ar = adjustState.aspectRatio;
            var cropW = 0, cropH = 0;
            if (cw / ch > ar) {
              cropH = ch * 0.85;
              cropW = cropH * ar;
            } else {
              cropW = cw * 0.85;
              cropH = cropW / ar;
            }
            // Center of crop in screen space (accounting for zoom+pan)
            // The image is drawn at scale with offset, centered at canvas center
            // screenX = (imageX * scale + cx * scale + offsetX) ... reverse
            // Actually: drawImage translates to (cx + offsetX, cy + offsetY), scales, rotates
            // Image is drawn centered at origin within translated/rotated coords
            // For simplicity with no rotation:
            var cx = cw / 2;  // center of canvas
            var cy = ch / 2;
            // Crop rect (top-left + size) in screen space, BEFORE zoom/pan
            // But zoom/pan affects where image pixels map to screen
            // Image is drawn centered at (cx + offsetX, cy + offsetY) with scale
            // So: screenX = imageX * scale + (cx + offsetX)
            // Reverse: imageX = (screenX - cx - offsetX) / scale
            // Crop rect in screen space (centered on canvas center, BEFORE offset)
            var cropScreenX = cx - cropW / 2;
            var cropScreenY = cy - cropH / 2;
            // Convert to image space
            var scale = adjustState.scale;
            var cropImgX = (cropScreenX - adjustState.offsetX) / scale;
            var cropImgY = (cropScreenY - adjustState.offsetY) / scale;
            var cropImgW = cropW / scale;
            var cropImgH = cropH / scale;
            // Clamp to image bounds
            cropImgX = Math.max(0, Math.min(adjustImage.width - cropImgW, cropImgX));
            cropImgY = Math.max(0, Math.min(adjustImage.height - cropImgH, cropImgY));
            cropImgW = Math.min(cropImgW, adjustImage.width - cropImgX);
            cropImgH = Math.min(cropImgH, adjustImage.height - cropImgY);
            
            log('Apply: original=' + adjustImage.width + 'x' + adjustImage.height + 
                ' crop=' + Math.round(cropImgW) + 'x' + Math.round(cropImgH) + ' at (' + Math.round(cropImgX) + ',' + Math.round(cropImgY) + ')');
            
            // Output at ORIGINAL resolution
            var outCanvas = document.createElement('canvas');
            var ow = adjustImage.width;
            var oh = adjustImage.height;
            // Keep A4 aspect ratio
            var outW, outH;
            if (ow / oh > ar) {
              // Image is wider - width limited
              outW = cropImgW;
              outH = cropImgW / ar;
            } else {
              outH = cropImgH;
              outW = cropImgH * ar;
            }
            outCanvas.width = cropImgW;
            outCanvas.height = cropImgH;
            var outCtx = outCanvas.getContext('2d');
            outCtx.drawImage(adjustImage, cropImgX, cropImgY, cropImgW, cropImgH, 0, 0, cropImgW, cropImgH);
            
            outCanvas.toBlob(function(blob) {
              if (!blob) {
                log('Apply error: output canvas toBlob failed');
                return;
              }
              var reader = new FileReader();
              reader.onload = function(ev) {

          var dist = Math.sqrt(dx * dx + dy * dy);
          if (lastDist > 0) {
            adjustState.scale *= dist / lastDist;
            drawAdjustCanvas();
          }
          lastDist = dist;
        } else if (e.touches.length === 1 && adjDragging) {
          adjustState.offsetX += e.touches[0].clientX - lastX;
          adjustState.offsetY += e.touches[0].clientY - lastY;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          drawAdjustCanvas();
        }
      }, { passive: false });
      adjustContainer.addEventListener('touchend', function() {
        lastDist = 0;
        adjDragging = false;
      });
    }

    function dataURLtoBlob(dataurl) {
      var arr = dataurl.split(',');
      var mime = arr[0].match(/:(.*?);/)[1];
      var bstr = atob(arr[1]);
      var n = bstr.length;
      var u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }

    function calcOvertimeHours(start, end) {
        // start/end like "09:00" → decimal hours at 0.25 increments (15 min)
        if (!start || !end) return "";
        var [sh, sm] = start.split(":").map(Number);
        var [eh, em] = end.split(":").map(Number);
        var totalMin = (eh * 60 + em) - (sh * 60 + sm);
        if (totalMin <= 0) totalMin += 24 * 60; // overnight
        // Round to nearest 0.25 (15 min)
        var quarterHours = Math.round(totalMin / 15);
        var decimal = quarterHours * 0.25;
        return decimal.toFixed(2);
    }

    function renderOvertimeCalendar() {
        var year = overtimeDate.getFullYear();
        var month = overtimeDate.getMonth();
        var monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
        var monthYearEl = document.getElementById("overtime-month-year");
        if (monthYearEl) {
            monthYearEl.textContent = year + "年" + monthNames[month];
        }

        // Display period total (16th of prev month to 15th of current month)
        var periodTotalEl = document.getElementById("overtime-period-total");
        if (periodTotalEl) {
            var periodHours = calcPeriodTotal(year, month);
            var prevMonth = month === 0 ? 12 : month;
            periodTotalEl.textContent = prevMonth + "/16～" + (month + 1) + "/15の合計: " + periodHours.toFixed(2) + "h";
        }

        loadSchedules(function() {
            drawOvertimeCalendar(year, month);
        });
    }

    function calcPeriodTotal(year, month) {
        // Period: 16th of previous month to 15th of current month
        var startPrevYear, startPrevMonth;
        if (month === 0) {
            startPrevYear = year - 1;
            startPrevMonth = 11;
        } else {
            startPrevYear = year;
            startPrevMonth = month - 1;
        }
        // Range: from (startPrevMonth 16) to (current month 15)
        var periodStart = startPrevYear + "-" + (startPrevMonth + 1).toString().padStart(2, "0") + "-16";
        var periodEnd = year + "-" + (month + 1).toString().padStart(2, "0") + "-15";
        var total = 0;
        allSchedules.forEach(function(s) {
            if (s.date >= periodStart && s.date <= periodEnd) {
                var hoursText = s.time || "";
                var entryHours = 0;
                if (hoursText.includes("-")) {
                    var tParts = hoursText.split("-");
                    if (tParts.length === 2) {
                        var calc = calcOvertimeHours(tParts[0], tParts[1]);
                        entryHours = parseFloat(calc) || 0;
                    }
                } else {
                    var hMatch = hoursText.match(/(\d+(\.\d+)?)/);
                    if (hMatch) entryHours = parseFloat(hMatch[1]);
                }
                total += entryHours;
            }
        });
        return total;
    }

    function drawOvertimeCalendar(year, month) {
        var calendarGrid = document.getElementById("overtime-calendar-grid");
        if (!calendarGrid) return;

        // Group schedules by day
        var schedulesByDay = {};
        allSchedules.forEach(function(s) {
            var parts = s.date.split("-");
            if (parts.length >= 3) {
                var sYear = parseInt(parts[0]);
                var sMonth = parseInt(parts[1]) - 1;
                var sDay = parseInt(parts[2]);
                if (sYear === year && sMonth === month) {
                    if (!schedulesByDay[sDay]) schedulesByDay[sDay] = [];
                    schedulesByDay[sDay].push(s);
                }
            }
        });

        calendarGrid.innerHTML = "";

        // Day headers
        var dayHeaders = ["日", "月", "火", "水", "木", "金", "土"];
        dayHeaders.forEach(function(day, idx) {
            var div = document.createElement("div");
            div.className = "calendar-day-header";
            div.textContent = day;
            if (idx === 0) div.classList.add("sun");
            if (idx === 6) div.classList.add("sat");
            calendarGrid.appendChild(div);
        });

        var firstDay = new Date(year, month, 1).getDay();
        var lastDate = new Date(year, month + 1, 0).getDate();

        for (var i = 0; i < firstDay; i++) {
            var emptyDiv = document.createElement("div");
            emptyDiv.style.cssText = "padding: 4px; font-size: 10px; color: #ccc;";
            calendarGrid.appendChild(emptyDiv);
        }

        var today = new Date();
        for (var day = 1; day <= lastDate; day++) {
            var dayDiv = document.createElement("div");
            dayDiv.style.cssText = "padding: 2px; font-size: 10px; text-align: center; border-radius: 4px; margin: 1px 0; min-width: 32px; min-height: 32px; position: relative;";

            var dayLabel = document.createElement("div");
            dayLabel.textContent = day;
            dayLabel.style.cssText = "font-weight: bold; color: #333;";
            var dayOfWeek = (firstDay + day - 1) % 7;
            if (dayOfWeek === 0) {
                dayLabel.classList.add("sun");
                dayLabel.style.color = "#e53935";
            } else if (dayOfWeek === 6) {
                dayLabel.classList.add("sat");
                dayLabel.style.color = "#1e88e5";
            }

            // Highlight today
            if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
                dayLabel.classList.add("today");
                dayLabel.style.cssText = "font-weight: bold; color: #00b900; border: 2px solid #00b900; border-radius: 50%; display: inline-block; padding: 2px 6px;";
            }

            // Click day → show inline edit form for new overtime entry
            dayLabel.onclick = function(e) {
                e.stopPropagation();
                var dayNum = parseInt(this.textContent);
                if (isNaN(dayNum)) return;
                var dateStr = year + "-" + (month + 1).toString().padStart(2, "0") + "-" + dayNum.toString().padStart(2, "0");
                currentEditId = null;
                document.getElementById("edit-schedule-title").value = "";
                document.getElementById("edit-schedule-date").value = dateStr;
                document.getElementById("edit-schedule-start-hour").value = "17";
                document.getElementById("edit-schedule-start-minute").value = "00";
                document.getElementById("edit-schedule-end-hour").value = "";
                document.getElementById("edit-schedule-end-minute").value = "00";
                document.getElementById("edit-schedule-hours").value = "";
                document.getElementById("edit-schedule-description").value = "";
                log("New overtime entry for date: " + dateStr);
            };
            dayDiv.appendChild(dayLabel);

            // Add overtime entries for this day
            if (schedulesByDay[day]) {
                schedulesByDay[day].forEach(function(s) {
                    var eventEl = document.createElement("div");
                    eventEl.className = "event-item";
                    var hoursText = s.time || "";
                    // Calculate hours for display
                    var entryHours = 0;
                    if (hoursText.includes("-")) {
                        var tParts = hoursText.split("-");
                        if (tParts.length === 2) {
                            entryHours = parseFloat(calcOvertimeHours(tParts[0], tParts[1])) || 0;
                        }
                    } else {
                        var hMatch = hoursText.match(/(\d+(\.\d+)?)/);
                        if (hMatch) entryHours = parseFloat(hMatch[1]);
                    }
                    eventEl.textContent = entryHours.toFixed(2);
                    eventEl.title = s.title + (s.time ? " | " + s.time : "") + (s.description ? "\n" + s.description : "");

    function loadSchedules(callback) {
        log('Loading schedules...');
        // The auth token arrives via /api/auth/login asynchronously after
        // liff.init. Poll briefly for it instead of issuing a request that
        // would 401 the moment the user opens the page. 15 attempts ×
        // 500ms = 7.5s, which is well within the host's auth budget.
        if (!getAuthToken()) {
            var tries = 0;
            var wait = setInterval(function () {
                if (getAuthToken() || ++tries >= 15) {
                    clearInterval(wait);
                    loadSchedules(callback);
                }
            }, 500);
            return;
        }
        var headers = { 'Authorization': 'Bearer ' + getAuthToken() };
        fetch("/schedules", { headers: headers, cache: 'no-store' })
            .then(function(resp) {
                if (!resp.ok) {
                    log('loadSchedules: HTTP ' + resp.status + ' (auth may be required)', true);
                    allSchedules = [];
                    if (callback) callback();
                    return null;
                }
                return resp.json();
            })
            .then(function(data) {
                if (data && Array.isArray(data.schedules)) {
                    allSchedules = data.schedules;
                    log('Schedules loaded: ' + allSchedules.length);
                } else {
                    allSchedules = [];
                    log('No schedules found');
                }
                if (callback) callback();
            })
            .catch(function(err) {
                log('Load schedules error: ' + err.message, true);
                allSchedules = [];
                if (callback) callback();
            });
    }

    // === UNIFIED SAVE HANDLER ===
    var saveEditBtn = document.getElementById("save-edit-btn");
    if (saveEditBtn) {
        saveEditBtn.onclick = function() {
            var title = document.getElementById("edit-schedule-title").value.trim();
            var date = document.getElementById("edit-schedule-date").value;
            var startHour = document.getElementById("edit-schedule-start-hour").value;
            var startMin = document.getElementById("edit-schedule-start-minute").value;
            var endHour = document.getElementById("edit-schedule-end-hour").value;
            var endMin = document.getElementById("edit-schedule-end-minute").value;
            var hours = document.getElementById("edit-schedule-hours").value;
            var description = document.getElementById("edit-schedule-description").value.trim();
            if (!date) { alert("日付は必須です"); return; }
            if (!startHour || !endHour) { alert("開始・終了時間を入力してください"); return; }

            var start = startHour + ":" + startMin;
            var end = endHour + ":" + endMin;

            // Auto-calculate hours from start/end (0.25刻み)
            hours = calcOvertimeHours(start, end);
            document.getElementById("edit-schedule-hours").value = hours;
            var timeVal = start + "-" + end;

            var method = currentEditId ? "PUT" : "POST";
            var url = currentEditId
                ? "/schedules/" + currentEditId
                : "/schedules";

            var headers = { "Content-Type": "application/json" };
            var tok = getAuthToken();
            if (tok) headers['Authorization'] = 'Bearer ' + tok;

            fetch(url, {
                method: method,
                headers: headers,
                body: JSON.stringify({ title: title || "残業", date: date, time: timeVal, description: description })
            })
            .then(function(resp) { return resp.json(); })
            .then(function(data) {
                if (data.success) {
                    alert("保存しました");
                    if (data.schedule) {
                        if (currentEditId) {
                            allSchedules = allSchedules.map(function(s) {
                                return s.id === currentEditId ? data.schedule : s;
                            });
                        } else {
                            allSchedules.push(data.schedule);
                            currentEditId = data.schedule.id;
                        }
                    }
                    renderOvertimeCalendar();
                } else {
                    alert("エラー: " + (data.error || "不明なエラー"));
                }
            })
            .catch(function(err) { log('Save error: ' + err.message, true); });
        };
    }

    var deleteEditBtn = document.getElementById("delete-edit-btn");
    if (deleteEditBtn) {
        deleteEditBtn.onclick = function() {
            if (!currentEditId) { alert("削除する記録を選択してください"); return; }
            if (confirm("削除しますか？")) {
                deleteSchedule(currentEditId);
            }
        };
    }

    function deleteSchedule(id) {
        var headers = {};
        var tok = getAuthToken();
        if (tok) headers['Authorization'] = 'Bearer ' + tok;
        fetch("/schedules/" + id, { method: "DELETE", headers: headers })
            .then(function(resp) { return resp.json(); })
            .then(function(data) {
                log('Schedule deleted');
                currentEditId = null;
                allSchedules = allSchedules.filter(function(s) { return s.id !== id; });
                renderOvertimeCalendar();
            })
            .catch(function(err) {
                log('Delete error: ' + err.message, true);
            });
    }

    // Auto-calculate hours when start/end change in edit form
    ["edit-schedule-start", "edit-schedule-end"].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) {
            el.addEventListener("change", function() {
                var start = document.getElementById("edit-schedule-start").value;
                var end = document.getElementById("edit-schedule-end").value;
                if (start && end) {
                    document.getElementById("edit-schedule-hours").value = calcOvertimeHours(start, end);
                }
            });
        }
    });
    // === END OVERTIME CALENDAR FUNCTIONS ===

    // === INIT LIFF ===
    async function initLiff() {
      log('initLiff: START');
      diag('1. SDK読込', typeof liff === 'undefined' ? 'liff が未定義' : 'OK');
      // Record why LIFF could not initialise. sendBentoCredentials() reads this
      // back so the bento tab reports the real cause instead of the generic
      // "liff.init 未解決または失敗", which tells nobody anything actionable.
      window.__liffInitError = '';
      var timeoutPromise = new Promise(function(resolve) {
        setTimeout(function() {
          // 60s, not 10s. A Render free instance sleeps after ~15 min idle and
          // needs ~50s to boot (pip install of the ASGI deps runs at start), so
          // the SDK, index.html and the LIFF handshake can all still be in
          // flight when a 10s budget expires — on a completely healthy app.
          log('initLiff: liff.init TIMEOUT after 60s', true);
          window.__liffInitError =
            'liff.init が60秒以内に解決しませんでした（サーバーの再起動中かもしれません）。';
          diag('2. liff.init', '60秒タイムアウト');
          try { window.__liffUnavailable && window.__liffUnavailable(); } catch (e) { /* guard must never throw */ }
          resolve('timeout');
        }, 60000);
      });
      try {
        log('initLiff: calling liff.init...');
        var result = await Promise.race([
          // Pass the scope explicitly. The SDK only puts openid in the client context
// when it is requested here or set in the LIFF console; relying on the console
// alone left getDecodedIDToken() returning an empty jwt, which the backend then
// rejected as "id_token がありません" with no indication of the real cause.
liff.init({
            liffId: '2011376207-0e7oVWOT',
            scope: ['openid', 'profile']
          }),
          timeoutPromise
        ]);
        if (result !== 'timeout') {
          // ``liff.init()`` resolves even when the page is opened in a
          // normal browser — the SDK is loaded as a plain script, so
          // ``liff`` exists and the promise resolves with an empty
          // context. Use ``isInClient()`` / a real logged-in flag to
          // decide whether the user is actually inside LINE.
          var inClient = (typeof liff.isInClient === 'function') ? liff.isInClient() : false;
          var loggedIn = (typeof liff.isLoggedIn === 'function') ? liff.isLoggedIn() : false;
          if (!inClient) {
            log('initLiff: not in LINE LIFF client — showing guard', true);
            window.__liffInitError = 'LIFF外からのアクセスです。LINEアプリ内のリンクから開いてください。';
            diag('2. liff.init', 'LIFF外');
            try { window.__liffUnavailable && window.__liffUnavailable(); } catch (e) { /* guard must never throw */ }
            return;
          }
          if (!loggedIn) {
            log('initLiff: not logged in — showing guard', true);
            window.__liffInitError = 'LINEログインが必要です。LINEアプリで再度リンクを開いてください。';
            diag('2. liff.init', '未ログイン');
            try { window.__liffUnavailable && window.__liffUnavailable(); } catch (e) { /* guard must never throw */ }
            return;
          }
          diag('2. liff.init', '成功');
          log('initLiff: liff.init SUCCESS');
          // We are inside a real LIFF client with a logged-in user. Drop
          // the guard and reveal the application shell.
          try { window.__liffReady && window.__liffReady(); } catch (e) { /* guard must never throw */ }
          // The bento tab may already be waiting on credentials; hand them over
          // now instead of making it poll.
          resetBentoCredentials();
          sendBentoCredentials();
          // Authenticate against the employees table once LIFF is ready. The
          // returned bearer token gates every other tab (/schedules,
          // /bike-logs) the same way /api/auth/login gates /api/orders. We
          // attach the token to every postMessage credential handoff so the
          // child tabs can present it as `Authorization: Bearer ...`.
          authenticateWithBento();
        }
      } catch (err) {
        window.__liffInitError = (err && (err.message || err.code || err.name)) || String(err);
        diag('2. liff.init', '失敗: ' + window.__liffInitError);
        log('initLiff: liff.init ERROR: ' + err.message, true);
        // The most common cause is opening the URL in a normal browser:
        // the SDK is loaded but liff.init() rejects because it cannot
        // reach the LINE runtime. Show the guard so the user is told
        // plainly what to do.
        try { window.__liffUnavailable && window.__liffUnavailable(); } catch (e) { /* guard must never throw */ }
      }
      log('initLiff: COMPLETE');
    }

    // === EMPLOYEES-TABLE AUTHENTICATION ===
    // Once LIFF is up, exchange the id_token for a server-side session via
    // the bento /api/auth/login endpoint. The returned bearer token is the
    // same one the bento tab uses; we re-use it for /schedules and
    // /bike-logs so every tab behind this app is gated by the same
    // employees-table check.
    //
    // Without a valid token, the bento backend refuses /api/orders with
    // 401. We mirror that for /schedules and /bike-logs by requiring the
    // same bearer header on those endpoints.
    var AUTH_TOKEN_KEY = '__bentoSessionToken';
    var AUTH_USER_KEY = '__bentoEmployee';

    async function authenticateWithBento(retry) {
      retry = retry || 0;
      try {
        var lineUserId = null;
        try { lineUserId = (typeof liff !== 'undefined' && liff.getContext) ? (liff.getContext().userId || null) : null; } catch (e) { lineUserId = null; }
        // liff.idToken() can legitimately be null right after liff.init()
        // resolves if the LIFF SDK is still resolving the openid context.
        // Keep polling until the token arrives or we hit a generous budget
        // — the previous 5-iteration cap (~4s) was too short on Render
        // cold-starts where liff.init() returned instantly but the SDK
        // handshake had not actually settled yet.
        var idToken = (typeof liff !== 'undefined' && liff.idToken) ? liff.idToken() : null;
        if (!lineUserId) {
          // No userId at all means liff.init() has not resolved. Wait
          // longer than for the idToken-only case.
          if (retry < 30) {
            setTimeout(function () { authenticateWithBento(retry + 1); }, 1000);
          } else {
            log('authenticateWithBento: giving up (no userId after 30s)', true);
            showAuthFailure('LINEの認証が完了しません。LINEアプリを完全に終了し、もう一度開いてください。');
          }
          return;
        }
        if (!idToken) {
          // userId is present but idToken is null — most often the openid
          // scope is missing or not saved in the LIFF console. We still
          // send a login request with an empty id_token; the server will
          // accept it only when BENTO_ALLOW_LOGIN_WITHOUT_ID_TOKEN=true
          // is set, but the attempt itself is harmless and lets the server
          // side give the same actionable error message.
          if (retry < 20) {
            setTimeout(function () { authenticateWithBento(retry + 1); }, 1000);
          } else {
            log('authenticateWithBento: idToken stays null after 20s; attempting login without id_token (will fail unless allow_login_without_id_token=true)', true);
          }
          // Either way (token arrived or we gave up waiting), fall through
          // and POST. The empty string for id_token is a valid value when
          // the server has the no-id-token escape hatch enabled.
        }
        // Use the same API base the bento iframe uses. The bento backend is
        // mounted on this same origin via app.include_router, so an empty
        // base means a same-origin POST.
        var apiBase = (function () {
          var p = new URLSearchParams(window.location.search).get('bentoApi');
          return p || BENTO_API_BASE || window.location.origin;
        })();
        var r = await fetch(apiBase + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ line_user_id: lineUserId, id_token: idToken || '' }),
          cache: 'no-store',
        });
        if (!r.ok) {
          // 5xx is a server-side problem, almost always Render's first
          // request after a cold-start (~50s boot). The user is not at
          // fault and the situation is not stable — retry with a
          // generous backoff before declaring auth failed.
          //
          // 4xx is a definitive response from the bento backend (401
          // unauthenticated, 403 not on the employees master, 503 ID
          // token verification disabled). Retry would not help, so show
          // the reason and stop.
          //
          // 5xx is a server-side problem, almost always Render's first
          // request after a cold-start (~50s boot). The user is not at
          // fault and the situation is not stable — retry with a
          // generous backoff before declaring auth failed. The earlier
          // version tried 10 attempts then called location.reload() to
          // restart the worker; users reported that the page reloaded
          // mid-action and they could not interact with the app until
          // it settled. Keep retrying in-place instead so the UI
          // stays stable and the user can keep using the app once the
          // server comes back.
          var errBody = await r.text();
          if (r.status >= 500) {
            // 30 attempts × 3-90s backoff = worst case ~22 minutes, but
            // Render's cold-start usually clears in under a minute. The
            // banner keeps the user informed without making them wait
            // for the app to become usable.
            if (retry < 30) {
              var backoffMs = Math.min(3000 * (retry + 1), 90000);
              log('authenticateWithBento: ' + r.status + ' (retry ' + (retry + 1) + ' in ' + (backoffMs/1000) + 's) ' + errBody.slice(0, 120), true);
              showAuthStatus('サーバ起動中…(' + (retry + 1) + '/30)');
              setTimeout(function () { authenticateWithBento(retry + 1); }, backoffMs);
              return;
            }
            // 30 retries exhausted. Show the red banner instead of
            // reloading — the user can read the server's error and
            // try again manually if they want. Reloading the page in
            // a loop is the bug the user just reported.
            log('authenticateWithBento: ' + r.status + ' exhausted 30 retries', true);
            showAuthFailure('サーバが応答しません (' + r.status + ')。しばらくしてから再度お試しください。');
            return;
          }
          log('authenticateWithBento: ' + r.status + ' ' + errBody.slice(0, 200), true);
          window[AUTH_TOKEN_KEY] = null;
          window[AUTH_USER_KEY] = null;
          // Surface the reason on the page so the user can act on it
          // without having to read the debug log. The bento backend's
          // message is already user-actionable; just pass it through.
          var msg = extractAuthMessage(errBody) || ('HTTP ' + r.status);
          showAuthFailure(msg);
          return;
        }
        var j = await r.json();
        // The bento /api/auth/login response shape: { token, employee }.
        // We accept both the documented shape and the legacy { session_token, employee }.
        var tok = j.token || j.session_token || null;
        window[AUTH_TOKEN_KEY] = tok;
        window[AUTH_USER_KEY] = j.employee || null;
        diag('2a. 社員認証', tok ? 'OK: ' + (j.employee && j.employee.name) : '拒否');
        log('authenticateWithBento: ' + (tok ? 'authenticated as ' + (j.employee && j.employee.name) : 'no token'));
        // Clear any transient status banner now that the auth
        // round-trip finished — it served its purpose during the cold-
        // start wait, but a persistent "サーバ起動中…" after the user
        // is signed in reads as a stuck app.
        if (tok && _authFailureBanner && _authFailureBanner.parentNode) {
          _authFailureBanner.parentNode.removeChild(_authFailureBanner);
          _authFailureBanner = null;
        }
        // Re-send credentials so child tabs receive the new authToken.
        resetBentoCredentials();
        resetBikeCredentials();
        sendBentoCredentials();
        sendBikeCredentials();
        // Re-fetch /schedules now that a Bearer token is available — the
        // initial loadSchedules() call issued before the token arrived
        // would have hit 401 and rendered an empty calendar. Now that we
        // have credentials, refresh the host's own data too.
        if (tok && typeof loadSchedules === 'function') {
          try { loadSchedules(); } catch (e) { log('refresh loadSchedules failed: ' + e.message, true); }
        }
        if (tok && typeof loadPaidHistories === 'function') {
          try { loadPaidHistories(); } catch (e) { log('refresh loadPaidHistories failed: ' + e.message, true); }
        }
      } catch (e) {
        log('authenticateWithBento: ' + e.message, true);
        if (retry < 3) {
          setTimeout(function () { authenticateWithBento(retry + 1); }, 1500);
        }
      }
    }

    // Pull the user-facing message out of the bento error envelope. The
    // server returns ``{"detail":{"error":"...","message":"..."}}`` for
    // auth failures; ``{"detail":[{...}]}`` for validation. The first
    // shape is the one the user needs to read, so prefer it.
    function extractAuthMessage(body) {
      try {
        var j = JSON.parse(body);
        if (j && j.detail) {
          if (typeof j.detail === 'object' && j.detail.message) return j.detail.message;
          if (typeof j.detail === 'string') return j.detail;
        }
        return null;
      } catch (e) { return null; }
    }

    // Show a full-page auth failure banner so the cause is impossible to
    // miss. The existing #authWait overlay is the natural place to reuse
    // — the host page does not have one, so create it on first use.
    var _authFailureBanner = null;
    function showAuthStatus(message) {
      if (!_authFailureBanner) {
        var b = document.createElement('div');
        b.id = 'host-auth-failure';
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#1d4ed8;color:#fff;padding:12px 16px;font-size:13px;z-index:99999;white-space:pre-wrap;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
        document.body.appendChild(b);
        _authFailureBanner = b;
      }
      _authFailureBanner.textContent = '⏳ ' + message;
    }
    function showAuthFailure(message) {
      if (!_authFailureBanner) {
        var b = document.createElement('div');
        b.id = 'host-auth-failure';
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:12px 16px;font-size:13px;z-index:99999;white-space:pre-wrap;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
        document.body.appendChild(b);
        _authFailureBanner = b;
      }
      _authFailureBanner.textContent = '⚠ 認証エラー: ' + message;
      // The user is not authenticated. Hide the application shell so the
      // form fields, calendars, and any cached content are not visible
      // behind the banner — they were rendered briefly before the auth
      // round-trip finished, and leaving them on screen leaks the shape
      // of the application to anyone who fails the employees check.
      var shell = document.getElementById('application-shell');
      if (shell) shell.style.display = 'none';
      // Show the dedicated auth-failure panel. We do NOT touch
      // #liff-guard because that overlay is reserved for the
      // "not inside LINE at all" case; if we overwrote it here and the
      // user's session later dropped back to the LIFF-not-loaded
      // path, they would see the wrong message flash. The two panels
      // are now independent so neither can corrupt the other.
      var panel = document.getElementById('auth-failure-panel');
      if (panel) {
        var body = document.getElementById('auth-failure-body');
        if (body) body.textContent = message;
        panel.style.display = 'flex';
      }
    }

    function getAuthToken() {
      return window[AUTH_TOKEN_KEY] || null;
    }

    // === START ===
    log('Starting...');
    log('Calling initLiff...');
    // Kick LIFF off without awaiting it. liff.init() can hang for its full 10s
    // timeout inside LINE, and awaiting it here delayed every UI initialiser
    // registered below (tab visibility, calendar render) until it settled —
    // which read as "the calendar is blank". Fire and forget; anything that
    // genuinely needs the ID token re-checks via sendBentoCredentials().
    initLiff().catch(function(e) {
      log('initLiff promise rejected: ' + e.message, true);
    });
    log('All initialization complete');

    // === DRAG & DROP + PASTE SUPPORT ===
    function handleDroppedOrPastedFile(file, targetInputId) {
      if (!file) return;
      if (!file.type || !file.type.startsWith('image/')) {
        log('Not an image file: ' + file.type, true);
        return;
      }
      var targetInput = document.getElementById(targetInputId);
      if (targetInput) {
        try {
          var dt = new DataTransfer();
          dt.items.add(file);
          targetInput.files = dt.files;
          targetInput.dispatchEvent(new Event('change'));
        } catch(err) { /* fallback */ }
      }
      log('File set via drag/drop/paste: ' + file.name + ' → ' + targetInputId);
    }

    function setupDragDrop(wrapperSelector, fileInputId) {
      var wrapper = document.querySelector(wrapperSelector);
      if (!wrapper) return;

      wrapper.addEventListener('dragenter', function(e) {
        e.preventDefault(); e.stopPropagation(); wrapper.classList.add('drag-over');
      });
      wrapper.addEventListener('dragover', function(e) {
        e.preventDefault(); e.stopPropagation(); wrapper.classList.add('drag-over');
      });
      wrapper.addEventListener('dragleave', function(e) {
        e.preventDefault(); wrapper.classList.remove('drag-over');
      });
      wrapper.addEventListener('drop', function(e) {
        e.preventDefault(); e.stopPropagation(); wrapper.classList.remove('drag-over');
        var files = e.dataTransfer.files;
        if (files.length > 0) {
          handleDroppedOrPastedFile(files[0], fileInputId);
        }
      });
    }

    setupDragDrop('.file-input-wrapper:nth-of-type(1)', 'search-image');
    setupDragDrop('.file-input-wrapper:nth-of-type(2)', 'adjust-image');

    document.addEventListener('paste', function(e) {
      var items = (e.clipboardData || e.originalEvent.clipboardData).items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.startsWith('image/')) {
          var file = items[i].getAsFile();
          if (file) {
            handleDroppedOrPastedFile(file, 'search-image');
            e.preventDefault(); break;
          }
        }
      }
    });

    log('Drag & Drop + Paste handlers installed');
    // === END DRAG & DROP + PASTE ===

    window.addEventListener("DOMContentLoaded", function() {
        // Fallback: explicitly ensure active tab content is visible
        var activeTab = document.querySelector('.tab-content.active');
        if (activeTab) { activeTab.style.display = 'block'; }

        // Wire the tab buttons. This used to be defined but never invoked, so
        // only the inline ontouchstart/onclick handlers were live and the
        // calendar never rendered on first paint.
        if (typeof initTabs === 'function') {
          try { initTabs(); } catch (e) { log('initTabs failed: ' + e.message, true); }
        }

        log("DOMContentLoaded: using switchTab");
        loadSchedules(function() {
            renderOvertimeCalendar();
        });
        loadPaidHistories();
    });
  </script>

  </div><!-- /application-shell -->

</body>
</html>
