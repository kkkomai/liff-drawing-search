<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0284c7" />
  <title>天気予報</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0284c7;
      --good: #16a34a;
      --warn: #f59e0b;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header .badge { font-size: 11px; opacity: 0.9; }
    main { padding: 12px; }

    #authWait {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      padding: 20px; text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    /* Current conditions summary. */
    .current-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .current-cell {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 10px;
    }
    .current-cell .label { font-size: 11px; color: var(--muted); }
    .current-cell .value { font-size: 22px; font-weight: 700; }
    .current-cell .unit { font-size: 11px; color: var(--muted); margin-left: 2px; }
    .current-icon { font-size: 56px; line-height: 1; }
    .current-summary { text-align: center; }
    /* Daily cards laid out as a horizontal scroller. */
    .daily-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .daily-card {
      flex: 0 0 110px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      scroll-snap-align: start;
    }
    .daily-card.today { border-color: var(--accent); border-width: 2px; }
    .daily-card .date {
      font-size: 11px;
      color: var(--muted);
    }
    .daily-card .weekday {
      font-size: 13px;
      font-weight: 700;
    }
    .daily-card .icon { font-size: 32px; line-height: 1.2; }
    .daily-card .temps { font-size: 14px; font-weight: 600; }
    .daily-card .max { color: #dc2626; }
    .daily-card .min { color: #2563eb; }
    .daily-card .rain { font-size: 11px; color: var(--muted); }
    .daily-card .wind { font-size: 11px; }
    .daily-card .verdict {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }
    .verdict-good { background: var(--good); }
    .verdict-warn { background: var(--warn); }
    .verdict-bad { background: var(--bad); }
    /* Detail panel for the selected day. */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--muted); }
    .detail-row .value { font-weight: 600; }
    .legend {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .toast {
      position: fixed; left: 50%; bottom: 16px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 9998;
      max-width: 90%;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #b91c1c; }
    .stale-banner {
      background: #fef3c7;
      color: #92400e;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌤️ 天気予報</h1>
    <span class="badge" id="apiStatus">接続待機</span>
  </header>

  <main>
    <div id="authWait">
      <div class="card" style="margin:0;max-width:320px;">
        <h2>認証待ち</h2>
        <div class="empty">ホストアプリからの認証情報を待機しています...</div>
      </div>
    </div>

    <div id="staleBanner" class="stale-banner" style="display:none;"></div>

    <div id="geoCard" class="card" style="display:none;">
      <h2>現在地予報</h2>
      <div class="current-grid">
        <div class="current-cell current-summary">
          <div class="current-icon" id="currentIcon">☀️</div>
          <div id="currentSummary">--</div>
        </div>
        <div>
          <div class="current-cell" style="margin-bottom:8px;">
            <div class="label">気温 / 風速</div>
            <div class="value" id="currentTemp">--<span class="unit">℃</span></div>
            <div class="value" id="currentWind" style="font-size:14px;">--<span class="unit">m/s</span></div>
          </div>
          <div class="current-cell">
            <div class="label">降水 / 位置</div>
            <div class="value" id="currentPrecip" style="font-size:14px;">--<span class="unit">%</span></div>
            <div class="value" id="currentLoc" style="font-size:11px;color:var(--muted);">--</div>
          </div>
        </div>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--good);"></span>◎ 走りやすい</span>
        <span><span class="dot" style="background:var(--warn);"></span>△ 風注意</span>
        <span><span class="dot" style="background:var(--bad);"></span>× 雨/強風</span>
      </div>
    </div>

    <div id="dailyCard" class="card" style="display:none;">
      <h2>今後16日</h2>
      <div class="daily-scroller" id="dailyScroller"></div>
    </div>

    <div id="detailCard" class="card" style="display:none;">
      <h2 id="detailTitle">-- の時間帯別</h2>
      <div id="detailBody"></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // ---- postMessage contract with the host (index.html) ----
    // Host -> child: { type: 'weather-credentials', apiBase, lineUserId?, idToken? }
    // Child -> host: { type: 'weather-ready' }
    // Host -> child: { type: 'weather-auth-error', message: '...' }
    const STATE = {
      apiBase: '',
      idToken: '',
      lineUserId: '',
      authed: false,
      geo: null,            // { latitude, longitude } or null
      forecast: null,       // raw Open-Meteo payload
      weatherCodeMap: null, // populated from /api/weather helper
    };

    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

    // WMO weather code -> { icon, label, summary } mapping. Open-Meteo
    // follows the WMO Code Table 4677.
    function wmo(code) {
      if (code === 0) return { icon: '☀️', label: '晴れ', summary: '快晴' };
      if (code === 1) return { icon: '🌤️', label: '晴れ', summary: 'ほぼ晴れ' };
      if (code === 2) return { icon: '⛅', label: '曇り', summary: '時々晴れ' };
      if (code === 3) return { icon: '☁️', label: '曇り', summary: '曇り' };
      if (code >= 45 && code <= 48) return { icon: '🌫️', label: '霧', summary: '霧' };
      if (code >= 51 && code <= 55) return { icon: '🌦️', label: '霧雨', summary: '霧雨' };
      if (code >= 56 && code <= 57) return { icon: '🌧️', label: '凍る霧雨', summary: '凍る霧雨' };
      if (code >= 61 && code <= 65) return { icon: '🌧️', label: '雨', summary: '雨' };
      if (code >= 66 && code <= 67) return { icon: '🌧️', label: '凍る雨', summary: '凍る雨' };
      if (code >= 71 && code <= 75) return { icon: '🌨️', label: '雪', summary: '雪' };
      if (code === 77) return { icon: '🌨️', label: 'ひょう', summary: 'ひょう' };
      if (code >= 80 && code <= 82) return { icon: '🌦️', label: 'にわか雨', summary: 'にわか雨' };
      if (code === 85 || code === 86) return { icon: '🌨️', label: 'にわか雪', summary: 'にわか雪' };
      if (code === 95) return { icon: '⛈️', label: '雷雨', summary: '雷雨' };
      if (code === 96 || code === 99) return { icon: '⛈️', label: '雷雨(雹)', summary: '雷雨(雹)' };
      return { icon: '🌡️', label: '不明', summary: '--' };
    }

    function showToast(msg, isError) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { el.className = 'toast' + (isError ? ' error' : ''); }, 2400);
    }
    function setStatus(text, ok) {
      const el = document.getElementById('apiStatus');
      el.textContent = text;
      el.style.color = ok ? '#bbf7d0' : '#fecaca';
    }
    function esc(s) {
      return String(s || '').replace(/[<>&"']/g, c => ({
        '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    // ---- postMessage handshake (mirrors bike / route) ----
    function start() {
      const params = new URLSearchParams(location.search);
      if (params.get('embedded') !== '1') {
        // Standalone / mock mode (open weather/index.html directly)
        STATE.apiBase = params.get('apiBase') || '';
        STATE.idToken = params.get('mockToken') || 'mock';
        STATE.lineUserId = params.get('mockUser') || 'demo-user';
        STATE.authed = true;
        onAuthed();
        return;
      }
      setStatus('認証待ち', false);
      let attempts = 0;
      const ask = () => {
        attempts += 1;
        try { window.parent.postMessage({ type: 'weather-ready' }, '*'); }
        catch (e) { /* parent may not be ready yet */ }
        if (attempts < 60) setTimeout(ask, 500);
        else showAuthFailure('ホストからの認証情報を取得できませんでした。タブを開き直してください。');
      };
      ask();
    }

    window.addEventListener('message', (ev) => {
      const d = ev.data || {};
      if (d.type === 'weather-credentials') {
        if (!d.apiBase) { showAuthFailure('APIベースURLが指定されていません。'); return; }
        STATE.apiBase = d.apiBase;
        STATE.idToken = d.idToken || '';
        STATE.lineUserId = d.lineUserId || '';
        STATE.authToken = d.authToken || '';
        STATE.authed = true;
        onAuthed();
      } else if (d.type === 'weather-auth-error') {
        showAuthFailure(d.message || '認証に失敗しました。');
      }
    });

    function showAuthFailure(msg) {
      const w = document.getElementById('authWait');
      w.innerHTML = '<div class="card" style="margin:0;max-width:320px;">' +
        '<h2>認証エラー</h2>' +
        '<div class="empty" style="color:var(--bad);">' + esc(msg) + '</div></div>';
      setStatus('未接続', false);
    }

    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (STATE.authToken) h['Authorization'] = 'Bearer ' + STATE.authToken;
      return h;
    }

    function onAuthed() {
      document.getElementById('authWait').style.display = 'none';
      setStatus('接続済み', true);
      locateAndFetch();
    }

    // ---- Geolocation ----
    function locateAndFetch() {
      setStatus('位置情報を取得中...', true);
      if (!navigator.geolocation) {
        showToast('このブラウザは位置情報に対応していません');
        fetchWeather(35.0116, 135.7681);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          fetchWeather(pos.coords.latitude, pos.coords.longitude);
        },
        (err) => {
          // On permission denied or timeout, fall back to a sensible
          // default (Kusatsu station) so the user still sees weather
          // data instead of an empty screen.
          showToast('位置情報を取得できませんでした（' + err.message + '）。草津駅の予報を表示します。');
          fetchWeather(35.0116, 135.7681);
        },
        { enableHighAccuracy: false, maximumAge: 30 * 60 * 1000, timeout: 15000 }
      );
    }

    async function fetchWeather(lat, lng, retry) {
      retry = retry || 0;
      try {
        STATE.geo = { latitude: lat, longitude: lng };
        const r = await fetch(
          STATE.apiBase + '/api/weather?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng),
          { headers: authHeaders(), cache: 'no-store' }
        );
        if (!r.ok) {
          let body = '';
          try { body = (await r.text()).slice(0, 240); } catch (e) { body = ''; }
          throw new Error('HTTP ' + r.status + (body ? ' ' + body : ''));
        }
        const j = await r.json();
        STATE.forecast = j.forecast || {};
        if (j.stale) {
          const sb = document.getElementById('staleBanner');
          sb.style.display = 'block';
          sb.textContent = '⚠ Open-Meteoとの接続に問題があるため、キャッシュされた古い予報を表示しています。';
        } else {
          document.getElementById('staleBanner').style.display = 'none';
        }
        renderCurrent();
        renderDaily();
        // Show the first day (today) detail by default.
        if (STATE.forecast.daily && STATE.forecast.daily.time && STATE.forecast.daily.time.length) {
          renderDetail(0);
        }
      } catch (e) {
        if (retry < 2) {
          await new Promise(r => setTimeout(r, 1000 * Math.pow(2, retry)));
          return fetchWeather(lat, lng, retry + 1);
        }
        const sb = document.getElementById('staleBanner');
        sb.style.display = 'block';
        sb.textContent = '天気の取得に失敗しました: ' + e.message;
        showToast('天気取得失敗: ' + e.message, true);
      }
    }

    // ---- Rendering ----
    function renderCurrent() {
      const c = STATE.forecast.current || {};
      const daily = STATE.forecast.daily || {};
      const d0 = {
        code: (c.weather_code !== undefined) ? c.weather_code : (daily.weather_code ? daily.weather_code[0] : 0),
        temp: c.temperature_2m,
        wind: c.wind_speed_10m,
        windDir: c.wind_direction_10m,
        rain: (daily.precipitation_probability_max && daily.precipitation_probability_max[0] !== undefined)
              ? daily.precipitation_probability_max[0] : null,
      };
      const w = wmo(d0.code);
      document.getElementById('currentIcon').textContent = w.icon;
      document.getElementById('currentSummary').textContent = w.summary;
      document.getElementById('currentTemp').innerHTML =
        (d0.temp != null ? d0.temp.toFixed(1) : '--') + '<span class="unit">℃</span>';
      document.getElementById('currentWind').innerHTML =
        (d0.wind != null ? d0.wind.toFixed(1) : '--') + '<span class="unit">m/s</span>' +
        (d0.windDir != null ? ' (' + degToCompass(d0.windDir) + ')' : '');
      document.getElementById('currentPrecip').innerHTML =
        (d0.rain != null ? d0.rain : '--') + '<span class="unit">%</span>';
      document.getElementById('currentLoc').textContent =
        STATE.geo ? STATE.geo.latitude.toFixed(3) + ', ' + STATE.geo.longitude.toFixed(3) : '--';
      document.getElementById('geoCard').style.display = '';
    }

    function degToCompass(deg) {
      if (deg == null) return '';
      const dirs = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
      return dirs[Math.round(((deg % 360) / 45)) % 8];
    }

    // Cycling verdict per day: combine rain probability, max wind, and
    // weather code. 5 m/s wind is a strong headwind; 8 m/s+ makes
    // riding uncomfortable. 30% rain probability is a yellow flag for
    // an unprotected cyclist.
    function rideVerdict(day) {
      const rain = day.precipitation_probability_max || 0;
      const wind = day.wind_speed_10m_max || 0;
      if (rain >= 60 || wind >= 8 || (day.weather_code >= 61 && day.weather_code <= 99)) {
        return { className: 'verdict-bad', label: '× 困難' };
      }
      if (rain >= 30 || wind >= 5) {
        return { className: 'verdict-warn', label: '△ 風雨注意' };
      }
      return { className: 'verdict-good', label: '◎ 良好' };
    }

    function renderDaily() {
      const daily = STATE.forecast.daily || {};
      const times = daily.time || [];
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const scroller = document.getElementById('dailyScroller');
      scroller.innerHTML = '';
      times.forEach((d, i) => {
        const dt = new Date(d + 'T00:00:00');
        const isToday = dt.getTime() === today.getTime();
        const day = {
          weather_code: (daily.weather_code || [])[i],
          temperature_2m_max: (daily.temperature_2m_max || [])[i],
          temperature_2m_min: (daily.temperature_2m_min || [])[i],
          precipitation_probability_max: (daily.precipitation_probability_max || [])[i],
          wind_speed_10m_max: (daily.wind_speed_10m_max || [])[i],
        };
        const w = wmo(day.weather_code);
        const v = rideVerdict(day);
        const card = document.createElement('div');
        card.className = 'daily-card' + (isToday ? ' today' : '');
        card.dataset.idx = String(i);
        card.innerHTML =
          '<div class="date">' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</div>' +
          '<div class="weekday">' + (isToday ? '今日' : WEEKDAYS[dt.getDay()]) + '</div>' +
          '<div class="icon">' + w.icon + '</div>' +
          '<div class="temps"><span class="max">' + (day.temperature_2m_max != null ? Math.round(day.temperature_2m_max) : '?') + '°</span> / <span class="min">' + (day.temperature_2m_min != null ? Math.round(day.temperature_2m_min) : '?') + '°</span></div>' +
          '<div class="rain">☔ ' + (day.precipitation_probability_max != null ? day.precipitation_probability_max : '?') + '%</div>' +
          '<div class="wind">💨 ' + (day.wind_speed_10m_max != null ? day.wind_speed_10m_max.toFixed(1) : '?') + ' m/s</div>' +
          '<div class="verdict ' + v.className + '">' + v.label + '</div>';
        card.addEventListener('click', () => renderDetail(i));
        scroller.appendChild(card);
      });
      document.getElementById('dailyCard').style.display = '';
    }

    function renderDetail(i) {
      const daily = STATE.forecast.daily || {};
      const hourly = STATE.forecast.hourly || {};
      const time = (daily.time || [])[i];
      if (!time) return;
      const dt = new Date(time + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const isToday = dt.getTime() === today.getTime();
      const titleText = (isToday ? '今日 ' : '') + (dt.getMonth() + 1) + '/' + dt.getDate() + ' (' + WEEKDAYS[dt.getDay()] + ')';
      document.getElementById('detailTitle').textContent = titleText + ' の時間帯別';
      // Find hourly rows for this day.
      const hourlyTimes = hourly.time || [];
      const rows = [];
      for (let h = 0; h < hourlyTimes.length; h++) {
        const ht = new Date(hourlyTimes[h]);
        if (ht.getFullYear() !== dt.getFullYear() || ht.getMonth() !== dt.getMonth() || ht.getDate() !== dt.getDate()) continue;
        rows.push({
          hour: ht.getHours(),
          temp: hourly.temperature_2m[h],
          rain: hourly.precipitation_probability[h],
          wind: hourly.wind_speed_10m[h],
          code: hourly.weather_code[h],
        });
      }
      // 3-hourly aggregation: pick 0,3,6,...,21 hours.
      const agg = [];
      for (let h = 0; h < 24; h += 3) {
        const slice = rows.filter(r => r.hour >= h && r.hour < h + 3);
        if (!slice.length) continue;
        const tempAvg = slice.reduce((s, r) => s + (r.temp || 0), 0) / slice.length;
        const rainMax = slice.reduce((m, r) => Math.max(m, r.rain || 0), 0);
        const windMax = slice.reduce((m, r) => Math.max(m, r.wind || 0), 0);
        const codeMid = slice[Math.floor(slice.length / 2)].code;
        agg.push({ hour: h, temp: tempAvg, rain: rainMax, wind: windMax, code: codeMid });
      }
      const body = document.getElementById('detailBody');
      body.innerHTML = agg.map(a => {
        const w = wmo(a.code);
        const verdict = (a.rain >= 60 || a.wind >= 8) ? '×'
                       : (a.rain >= 30 || a.wind >= 5) ? '△' : '◎';
        return '<div class="detail-row">' +
          '<span class="label">' + String(a.hour).padStart(2, '0') + ':00 ' + w.icon + ' ' + w.label + ' ' + verdict + '</span>' +
          '<span class="value">' +
            (a.temp != null ? a.temp.toFixed(1) + '℃' : '--') +
            ' / ☔' + Math.round(a.rain) + '%' +
            ' / 💨' + a.wind.toFixed(1) + 'm/s' +
          '</span></div>';
      }).join('');
      document.getElementById('detailCard').style.display = '';
    }

    // ---- Boot ----
    start();
  </script>
</body>
</html>
