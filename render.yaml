services:
  - type: web
    name: liff-drawing-search
    env: python
    plan: free
    buildCommand: python3 -c "import os; open('.render-rebuild-trigger', 'w').write(str(os.time()))" && pip install -r requirements.txt 2>/dev/null || true
    startCommand: python3 search_server.py
    staticPublishPath: .
