services:
  - type: web
    name: liff-drawing-search
    env: python
    plan: free
    # Trigger rebuild
    envVars:
    - key: HERMES_API_URL
      value: https://hermes.example.com/api/search
    buildCommand: python3 -c "import re; [open(f,'w').write(re.sub(r'v20260917[a-z]+','v20260917z',open(f).read())) for f in ['form.html','search_server.py']]; print('OK')"
    startCommand: python3 search_server.py
